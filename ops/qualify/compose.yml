# The Bridge's qualification profile (4.1.18 "Dress Rehearsal", docs/dev/PLAN-4.1.18-DRESS-REHEARSAL.md §8; README.md
# beside this file): an HTTPS proxy, three Bridge instances on one Postgres, two tenants. Not the development compose
# (bridge/dev/docker-compose.yml, a Postgres only). `npm run ops:qualify` writes the environment it needs (QUALIFY_*),
# builds the Bridge image from the candidate's tarball and drives it; nothing here is bound to this checkout.
#
# Every image is pinned by digest. The Bridges run as the operator's uid, read-only, with a bounded /tmp, no
# capability and no new privilege; their tenants' directories (keys, tokens: files of mode 600) are mounted read-only;
# the database URL and password are secret files, never environment values. Three networks: `public` (the proxy's
# ports, on 127.0.0.1 only), `edge` (the proxy and the Bridges) and `store` (the Bridges and Postgres), the last two
# internal: Postgres and the Bridges' own ports are never published.
name: quest-n-click-qualify

x-bridge: &bridge
  build:
    context: ${QUALIFY_BUILD:?ops:qualify sets QUALIFY_BUILD}
    dockerfile: Dockerfile.bridge
  image: quest-n-click-bridge:qualify
  # The proxy is trusted by its fixed address on `edge` (second reading of 4.1.18 PR 4): without it every client
  # shares the proxy's address, and one client failing its token would close the per-address limits for everyone.
  command:
    [
      'serve',
      '--tenants=/srv/bridge/a,/srv/bridge/b',
      '--tenant-header',
      '--host=0.0.0.0',
      '--port=8787',
      '--trust-proxy=172.30.18.2',
    ]
  user: '${QUALIFY_UID:-1000}:${QUALIFY_GID:-1000}'
  environment:
    BRIDGE_STORE_FILE: /run/secrets/store_url
  secrets: [store_url]
  volumes:
    - ${QUALIFY_DATA:?ops:qualify sets QUALIFY_DATA}/a:/srv/bridge/a:ro
    - ${QUALIFY_DATA}/b:/srv/bridge/b:ro
    # 4.1.19 (plan §9): the speedrun worker and the game it verifies, read-only: the committed tree of what it reads (a
    # `git archive`, never the checkout with its .git or private folders) and the installed modules. The worker is not in the Bridge's
    # archive (an operator gives it, as here, with the game's sources); the Bridge runs it as a child, confined by
    # this container: no network but the store's, read-only, bounded memory and processes.
    - ${QUALIFY_APP:?ops:qualify sets QUALIFY_APP}:/srv/app:ro
    - ${QUALIFY_MODULES:?ops:qualify sets QUALIFY_MODULES}:/srv/app/node_modules:ro
  read_only: true
  tmpfs:
    - /tmp:rw,size=64m
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  pids_limit: 128
  mem_limit: 512m
  networks: [edge, store]
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/readyz').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    interval: 3s
    retries: 20
  restart: 'no'

services:
  postgres:
    image: mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
    environment:
      POSTGRES_USER: bridge
      POSTGRES_DB: bridge
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [store]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'bridge']
      interval: 2s
      retries: 30
  bridge-1: *bridge
  bridge-2: *bridge
  bridge-3: *bridge
  proxy:
    image: mirror.gcr.io/library/caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    # 4.1.19 (plan §6.4): the operator's uid, never root; the image read-only; its two writable folders (the local CA
    # and certificates, Caddy's autosaved configuration) bounded tmpfs, a new CA at each start (ops:qualify reads it
    # again). It listens on 8443–8446, unprivileged ports: the only capability it keeps is the one its binary carries
    # as a file capability (cap_net_bind_service), without which the kernel refuses to run it.
    user: '${QUALIFY_UID:-1000}:${QUALIFY_GID:-1000}'
    read_only: true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:rw,size=16m,mode=1777
      - /config:rw,size=4m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    ports:
      - '127.0.0.1:${QUALIFY_PORT:-8443}:8443'
      - '127.0.0.1:${QUALIFY_PORT_1:-8444}:8444'
      - '127.0.0.1:${QUALIFY_PORT_2:-8445}:8445'
      - '127.0.0.1:${QUALIFY_PORT_3:-8446}:8446'
    networks:
      public: {}
      edge:
        ipv4_address: 172.30.18.2
    depends_on: [bridge-1, bridge-2, bridge-3]

networks:
  public: {}
  edge:
    internal: true
    ipam:
      config:
        - subnet: 172.30.18.0/24
          # Others take their address from the upper half: the proxy's own (172.30.18.2) is never given to a Bridge.
          ip_range: 172.30.18.128/25
  store:
    internal: true

volumes:
  pgdata: {}

secrets:
  pg_password:
    file: ${QUALIFY_SECRETS:?ops:qualify sets QUALIFY_SECRETS}/pg_password
  store_url:
    file: ${QUALIFY_SECRETS}/store_url
