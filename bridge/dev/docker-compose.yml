# A Postgres for the Bridge's distributed profile on a developer's machine (4.1.10, wiki/en/bridge.install-run.md): the image
# CI's `bridge-postgres` job runs, pinned by digest. `docker compose -f bridge/dev/docker-compose.yml up -d`, then
# BRIDGE_PG_URL=postgres://bridge:bridge@127.0.0.1:55432/bridge npx vitest run tests/bridge-reality-store.test.ts
services:
  postgres:
    image: mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
      POSTGRES_DB: bridge
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'bridge']
      interval: 2s
      retries: 30
