name: ci
on:
  push:
    # main deploys to Pages; a tag releases. A topic branch runs through its pull request (4.1.4; the ruleset on main
    # requires these checks on the pull request's head), so a push runs once, not twice.
    branches: [main]
    tags: ['v*']
  pull_request:
# The token does nothing but read (4.1.3); the Pages job asks for what it needs. One run per ref at a time: a push
# that supersedes another cancels it (the runners are the bottleneck).
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Three tiers (4.1.9, lot 0). The fast tier, on every change: `plan`, `check` (format, lint, knip, types, the game's
# gates, the build, the baseline) and `coverage` (the unit suite, once). The second tier needs `check` and runs only
# what the change can break, as `plan` (tools/ci-plan.ts) classifies the diff: a job it spares still runs, says "not
# needed by the plan" and succeeds, because the ruleset requires each job by name and a skipped job is not a success.
# On main, on a tag and on a pull request labelled `full-ci`: everything. The third tier (mutation on a `full-ci`
# pull request, the nightly corpus and heavy proofs, release-check) runs off the pull request path. `pr-gate` reads every job's result: the
# candidate single required check, once a few runs have been green.
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as its merge commit: HEAD^1 is the base it merges into.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No `npm ci`: the plan imports nothing but Node. A git error, or `--all`, runs everything.
      - id: plan
        env:
          ALL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$ALL" = true ]; then flag=--all; else flag=--base=HEAD^1; fi
          plan=$(node --experimental-strip-types --no-warnings tools/ci-plan.ts "$flag")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
  # The fast tier: what every change must pass, in one job. `build:game` and not `build`, which would run the unit
  # suite a second time (`coverage` runs it). The dist it builds in the shape Pages deploys (game + Studio demo) is
  # kept as an artifact: the e2e rows and pwa-firefox play it instead of building it again.
  check:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the fragments' check diffs against main's merge base (tools/changes.ts, 4.1.9)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: for i in 1 2 3; do (pip install -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      # A pull request that changes the code carries its CHANGELOG and LOG fragment (changes/README.md, 4.1.9); the
      # step waits for the tool to be on the branch.
      - if: github.event_name == 'pull_request'
        run: npm run changes -- --check --base=origin/main
      # The trust root of the people's passes is never changed with an attestation (4.1.20, ADR 0024).
      - if: github.event_name == 'pull_request'
        run: npm run -s field:carry -- --check-range=origin/main...HEAD
      # Formatting, code lint, knip, both TypeScript configurations, content lint (4.1.0 "Clarity").
      - run: npm run quality
      - run: npm run docs:truth
      # validate --release measures the stems with ffprobe (3.6).
      - run: bash scripts/ci-ffmpeg.sh
        timeout-minutes: 20
      # The game's gates (validate, solve, i18n, content lint, playtests), the bundle, verify:dist, spoilers, assets.
      - run: npm run build:game
      # The weight budget with the app shell of this fresh build (the Node test weighs the game's assets only).
      - run: npm run weight -- --release
      # The behaviour of 4.0.0 frozen (4.1.0 "Clarity"): the same witnesses, proofs, golden saves, public surface, and a
      # first visit no bigger, whatever a refactoring moved (tools/quality-baseline.ts).
      - run: npm run quality:baseline -- --check --dist
      # The exhaustive proof of the sample game (seconds); a big game proves on the weekly prove workflow instead.
      - run: npm run prove:game
      # The shipped dependencies' advisories: when the lockfile or package.json moved, and always on main and tags.
      - if: fromJSON(needs.plan.outputs.plan).auditDeps
        run: npm run audit:deps
      # The two-entry build the e2e rows play (game + Studio demo): a chunk the game needs but the worker does not
      # precache only shows up in that shape.
      - run: npm run build:web
        env:
          STUDIO: '1'
          VITE_STUDIO_DEMO: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      # The same shape under the repository's base path, for Pages.
      - run: npm run build:web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          STUDIO: '1'
          VITE_STUDIO_DEMO: '1'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  # The unit suite under V8 coverage, once (4.1.9: `node-24` no longer runs `quality`, `check` no longer runs the suite).
  # The floors of vite.config.ts fail here; the ratchet (a floor three points or more under what is measured) warns on
  # a pull request and fails on main and on a tag (`--strict`, as the nightly and release-check).
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the fragments' check diffs against main's merge base (tools/changes.ts, 4.1.9)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: for i in 1 2 3; do (pip install -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      # validate --release measures the stems with ffprobe (tests/tooling.test.ts).
      - run: bash scripts/ci-ffmpeg.sh
        timeout-minutes: 20
      - run: npm run test:coverage
      - run: npx tsx tools/coverage-ratchet.ts ${{ github.event_name != 'pull_request' && '--strict' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-summary
          path: .cache/coverage/coverage-summary.json
          if-no-files-found: ignore
  # The mutation matrix (4.1.20 PR 2a, plan §7.3): every shard of every gated set, from
  # tools/mutation-shards.ts — no workflow writes its list of sets by hand (tests/mutate-shards.test.ts).
  mutation-plan:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - id: m
        shell: bash
        run: |
          echo "matrix=$(npx tsx tools/mutation-shards.ts --matrix=gated)" >> "$GITHUB_OUTPUT"
  # One job per shard (4.1.17: a set's length never cuts another's result short; 4.1.20: a long set in shards). Each
  # job has a Postgres service; only the set that needs one is given its URL (the others' tests would run their
  # Postgres cases too and judge mutants otherwise than the gate).
  mutation:
    needs: [mutation-plan]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: mutation (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bridge" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - id: inputs
        run: echo "hash=$(npx tsx tools/mutate.ts --set=${{ matrix.set }} --hash)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mutation
          key: mutation-${{ matrix.name }}-${{ steps.inputs.outputs.hash }}
      - run: npm run test:mutation:core -- --set=${{ matrix.set }} --shard=${{ matrix.shard }}/${{ matrix.shards }} | tee mutation-${{ matrix.name }}.txt
        shell: bash
        env:
          BRIDGE_PG_URL: ${{ matrix.pg && 'postgres://bridge:bridge@127.0.0.1:5432/bridge' || '' }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.name }}
          path: |
            mutation-${{ matrix.name }}.txt
            .cache/mutation/report-${{ matrix.set }}.shard-${{ matrix.shard }}of${{ matrix.shards }}.json
          include-hidden-files: true
          if-no-files-found: ignore
  # Each set's shards merged into its report (`mutation-<set>`, the artifact the gate, the baseline and the summaries
  # read): a shard missing, doubled, cancelled or of other inputs fails it, so no gate passes on part of a set.
  mutation-merge:
    needs: [mutation-plan, mutation]
    if: always() && needs.mutation-plan.result == 'success' && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: shards
      - shell: bash
        run: |
          code=0
          for set in $(echo '${{ needs.mutation-plan.outputs.matrix }}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log([...new Set(JSON.parse(s).include.filter(e=>e.gated).map(e=>e.set))].join(' ')))"); do
            npx tsx tools/mutate.ts --set="$set" --merge --from=shards || code=1
            mkdir -p merged/.cache/mutation && { cp ".cache/mutation/report-$set.json" merged/.cache/mutation/ 2>/dev/null || true; }
          done

          exit $code
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-merged
          path: merged
          include-hidden-files: true
          if-no-files-found: ignore
  # Biscuit's official samples in the JavaScript build the Bridge runs and in the Rust crate (4.1.1, D16): the same
  # verdict as the specification in both. The runner image has cargo. Gate: `reality`.
  reality-xcheck:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN: ${{ fromJSON(needs.plan.outputs.plan).reality }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::reality-xcheck not needed by the plan (no Reality path changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: npm run reality:xcheck -- --require-rust
  # The connectors of the world outside (4.1.9, D19, docs/en/CONNECTORS.md): the SDK's contract on the four connectors
  # against a real Bridge, their abuse and fuzz tests, the sample chapter's replays, a game without server code, then
  # the fuzz harness for half a minute per connector (the nightly runs a minute) and the connectors' tarball installed
  # without native code (ssh2's install script attempts a build and fails: no .node file). Gate: `reality`.
  connectors:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN: ${{ fromJSON(needs.plan.outputs.plan).reality }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::connectors not needed by the plan (no Reality path changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: npx vitest run tests/connectors-*.test.ts tests/dist-no-server-code.test.ts
      # A key pair ssh2 refused, kept with why (tests/fixtures/connectors/harness.ts, 4.1.19): the flake's evidence.
      - if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flakes-connectors
          path: .cache/flakes
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
      - if: env.RUN == 'true'
        run: npm run fuzz:connectors -- --cases=10000 --seconds=30
      - if: env.RUN == 'true'
        run: GAME=signals npm run solve:reality
      - name: The connectors' tarball installs without native code and answers
        if: env.RUN == 'true'
        run: |
          node scripts/pack.mjs --out=.cache/pack
          mkdir -p .cache/operator && cd .cache/operator && echo '{"name":"operator","private":true}' > package.json
          npm install --omit=optional --ignore-scripts --no-audit --no-fund ../pack/web-scumm-connectors-*.tgz
          npx web-scumm-connector --help | grep -q 'usage: web-scumm-connector'
          ! find node_modules -name '*.node' | grep -q .
  # The hosted Studio (4.2.1): the journal on Postgres with its blobs in S3, the service lease, the processing worker
  # through presigned URLs, the spans' leases racing on Postgres, and the login, back-channel logout and a disabled
  # user against a real Keycloak (tests/studio-keycloak.test.ts, the realm of ops/studio/keycloak/). S3 is SeaweedFS
  # (its S3 gateway checks SigV4 and presigned URLs, as Cellar does; MinIO no longer publishes free images), its test
  # identity in ops/studio/ci/. A service container takes no command: SeaweedFS and Keycloak start in steps.
  # Gate: `studioHosted`.
  studio-hosted:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN: ${{ fromJSON(needs.plan.outputs.plan).studioHosted }}
      STUDIO_TEST_PG_URL: postgres://studio:studio@127.0.0.1:5432/studio
      STUDIO_TEST_S3: http://studio-ci:studio-ci-secret-not-for-production@127.0.0.1:8333/studio-ci
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::studio-hosted not needed by the plan (no Studio Server path changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      # The asset tools (4.2.2 PR 6b): "Prepare assets" runs them in the worker's child of the e2e stack.
      - if: env.RUN == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (pip install -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: bash scripts/ci-ffmpeg.sh
      - if: env.RUN == 'true'
        name: S3 (SeaweedFS)
        run: |
          docker run -d --name seaweedfs -p 127.0.0.1:8333:8333 \
            -v "$PWD/ops/studio/ci/seaweedfs-s3.json:/etc/s3.json:ro" \
            mirror.gcr.io/chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            server -s3 -s3.port=8333 -s3.config=/etc/s3.json -dir=/data
          # Ready means writable: the bucket made (asked again until it is listed: a second create of an existing bucket
          # fails), then one object written and read back (ops/studio/ci/s3-ready.ts).
          bucket() { docker exec seaweedfs sh -c 'echo "s3.bucket.list" | weed shell' 2>/dev/null | grep -q studio-ci; }
          for i in $(seq 1 90); do
            bucket && break
            docker exec seaweedfs sh -c 'echo "s3.bucket.create -name studio-ci" | weed shell' >/dev/null 2>&1 || true
            sleep 1
          done
          bucket || { echo "no bucket"; docker logs seaweedfs; exit 1; }
          for i in $(seq 1 60); do npx tsx ops/studio/ci/s3-ready.ts && exit 0; sleep 1; done
          echo "the bucket is not writable"; docker logs seaweedfs; exit 1
      - if: env.RUN == 'true'
        name: Keycloak (the test realm)
        # Pinned by digest; it reaches this runner as host.docker.internal for its back-channel logouts.
        run: |
          docker run -d --name keycloak -p 127.0.0.1:8080:8080 --add-host=host.docker.internal:host-gateway \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin-ci-only \
            -v "$PWD/ops/studio/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858 \
            start-dev --import-realm
          for i in $(seq 1 120); do
            curl -fsS -m 2 -o /dev/null http://127.0.0.1:8080/realms/web-scumm/.well-known/openid-configuration && exit 0
            sleep 2
          done
          docker logs keycloak; exit 1
      - if: env.RUN == 'true'
        env:
          STUDIO_TEST_KEYCLOAK: http://127.0.0.1:8080
          STUDIO_TEST_KEYCLOAK_ADMIN: admin:admin-ci-only
        run: npx vitest run tests/studio-server.test.ts tests/studio-worker.test.ts tests/studio-collab.test.ts tests/studio-keycloak.test.ts --maxWorkers=1 --no-file-parallelism
      # The hosted Studio in a browser (4.2.1 PR 7): its page, the game on its own origin (another site), the editor's
      # solicited save, the wall between the two; Chromium over http, Firefox over https. Not WebKit here: on Linux it
      # stores no cookie a frame of another host sets (even one site), unlike Safari; it is run on macOS.
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npx playwright install --with-deps chromium firefox) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 10
      - if: env.RUN == 'true'
        run: npm run studio-client && npm run e2e:studio-hosted && npm run e2e:studio-hosted -- --browser=firefox && npm run e2e:studio-collab && npm run e2e:studio-collab -- --browser=firefox
  # The Bridge's distributed profile (4.1.10, D20): the store contract, the tenants crossed and the fan-out across
  # instances, on a real Postgres 16 (a service container, pinned by digest). The truth for Postgres: the maintainer's
  # machine runs it only with a local server (docs/en/REALITY-OPS.md). Gate: `reality`.
  bridge-postgres:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN: ${{ fromJSON(needs.plan.outputs.plan).reality }}
      BRIDGE_PG_URL: postgres://bridge:bridge@127.0.0.1:5432/bridge
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::bridge-postgres not needed by the plan (no Reality path changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        # Every file that judges the Postgres adapter (4.1.20 PR 2a: five of the eight were run here before), from the set's
        # one list, one file after the other (each in a database of its own, tests/fixtures/pg-database.ts).
        # The list first: a failed listing stops the step instead of running the whole suite.
        run: |
          files=$(npx tsx tools/mutation-sets.ts --tests=reality-store-postgres)
          [ -n "$files" ]
          npx vitest run $files --maxWorkers=1 --no-file-parallelism
  # Reality Bridge end to end (4.1.1, scripts/e2e-reality.mjs): the sample game games/signals built for production, a
  # reference Bridge, pairing from the pause menu, the same webhook twice, offline then online, applied once, the
  # session replayed with the Bridge stopped. WebKit cannot reopen offline under automation (as e2e:pwa). Its own build
  # (GAME=signals). Gate: `reality`.
  reality:
    needs: [plan, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      RUN: ${{ fromJSON(needs.plan.outputs.plan).reality }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::reality (${{ matrix.browser }}) not needed by the plan (no Reality path changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (pip install -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npx playwright install --with-deps ${{ matrix.browser }}) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: npm run assets
        env:
          GAME: signals
      - if: env.RUN == 'true'
        run: npx vite build
        env:
          GAME: signals
      - if: env.RUN == 'true'
        run: npm run solve:reality
        env:
          GAME: signals
      - if: env.RUN == 'true'
        run: npx vite preview --port 5176 --strictPort &
        env:
          GAME: signals
      - if: env.RUN == 'true'
        run: for i in $(seq 1 60); do curl -sf http://127.0.0.1:5176/ > /dev/null && break; sleep 1; done
      - if: env.RUN == 'true'
        run: npm run e2e:reality -- http://127.0.0.1:5176/ --browser=${{ matrix.browser }} ${{ matrix.browser == 'webkit' && '--allow-skip' || '' }}
  # The next Node (4.1.3): `engines` says >= 22, so the unit suite runs on 24 as well; `quality` (format, lint, types)
  # does not depend on Node's version and runs once, in `check` (4.1.9). Gate: `node24` (any code path).
  node-24:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN: ${{ fromJSON(needs.plan.outputs.plan).node24 }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::node-24 not needed by the plan (no code changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The same prerequisites as `coverage`: the unit suite runs the art tools and probes the stems (tests/tooling.test.ts).
      - if: env.RUN == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (pip install -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: bash scripts/ci-ffmpeg.sh
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: npm run test:node
  # Windows (4.1.8, programme §4.4): what a studio on Windows runs every day, on a real Windows runner: the doctor, the
  # type checks and the unit suite, a build of the sample game, the production server answering. Its own build: the
  # build on Windows is what it checks. Not a required check until the maintainer adds it to the ruleset; Python is
  # optional there (no assets rebuilt). Gate: `windows` (any code path).
  windows:
    needs: [plan, check]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUN: ${{ fromJSON(needs.plan.outputs.plan).windows }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::windows not needed by the plan (no code changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npx playwright install chromium) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: npm run doctor
      # The junction, the type checks, then the unit suite without six files that assume POSIX (file modes 0600,
      # `/` in paths, the shell's tools): named here, said in SUPPORT, ported by `fix/418-windows-tests`. Since 4.1.9
      # also the connectors' Telnet and SSH tests, and the two that drive them (the SDK's contract, the abuse run):
      # they time sockets, idle limits and a thousand connections the POSIX way, not yet ported (SUPPORT says so).
      # Since 4.2.1 also the Studio Server's processing worker, which runs on Linux only (process groups, `kill(-pid)`).
      # Then the game's gates and the build (`build` would run `check` a second time).
      - if: env.RUN == 'true'
        run: npx tsx tools/select-game.ts && npm run -s tsc -- --noEmit
      - if: env.RUN == 'true'
        run: npm run test:node -- --exclude tests/bridge.test.ts --exclude tests/file-size.test.ts --exclude tests/prompts.test.ts --exclude tests/status.test.ts --exclude tests/studio-demo.test.ts --exclude tests/tooling.test.ts --exclude tests/connectors-terminal.test.ts --exclude tests/connectors-ssh.test.ts --exclude tests/connectors-sdk.test.ts --exclude tests/connectors-abuse.test.ts --exclude tests/studio-worker.test.ts --exclude tests/studio-client.test.ts
      - if: env.RUN == 'true'
        run: npm run build:game
      - name: The production server answers
        if: env.RUN == 'true'
        run: |
          PORT=5191 node scripts/start.mjs > server.log 2>&1 &
          trap 'kill %1 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:5191/ >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:5191/ | grep -q '<html' || { echo "::error::no page from the production server"; cat server.log; exit 1; }
          curl -fs http://127.0.0.1:5191/manifest.webmanifest >/dev/null
  # A second game, as `npm run new-game` makes it: every gate the sample game passes (check, verify:game, prove:game,
  # the build, the production e2e with axe and saves), without a single test written for it. A gate since 3.2. Its own
  # build (GAME=second). Gate: `secondGame` (the template, the packages, the authoring tools, the e2e driver).
  second-game:
    needs: [plan, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUN: ${{ fromJSON(needs.plan.outputs.plan).secondGame }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::second-game not needed by the plan (no template, package or authoring path changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (pip install -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npx playwright install --with-deps chromium) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: npm run new-game second "Second Game"
      - if: env.RUN == 'true'
        run: npm run assets
      # validate --release measures the stems with ffprobe (3.6).
      - if: env.RUN == 'true'
        run: bash scripts/ci-ffmpeg.sh
        timeout-minutes: 20
      # build:game (4.1.3): the game's own gates and the bundle, without the unit suite `coverage` runs.
      - if: env.RUN == 'true'
        run: npm run build:game
        env:
          GAME: second
      - if: env.RUN == 'true'
        run: npm run prove:game
        env:
          GAME: second
      - if: env.RUN == 'true'
        run: npm run preview -- --port 5174 &
        env:
          GAME: second
      - if: env.RUN == 'true'
        run: for i in $(seq 1 60); do curl -sf http://127.0.0.1:5174/ > /dev/null && break; sleep 1; done
      - if: env.RUN == 'true'
        run: npm run e2e -- http://127.0.0.1:5174/ --game second --prod --generic --axe --save
        env:
          GAME: second
  # The production bundle played by touch. Chromium runs the complete game-specific walkthrough and WebKit the
  # generic solver session; both gate the deploy (WebKit after three consecutive green runs on main, D7). The keyboard
  # row gates too since 3.2; WebKit at the keyboard and the French row since 3.3.1 (green on every run of 3.3, D7).
  # The rows play the dist `check` built (4.1.9) instead of building it six times. Gate: `e2e` (the engine's DOM, the
  # sample game, the Studio, the e2e scripts, the visual references).
  e2e:
    needs: [plan, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            mode: full
            experimental: false
          - browser: webkit
            mode: generic
            experimental: false
          # The whole game at the keyboard (verbs, targets, choices, the map, Space to advance a line), axe-core on
          # four screens: a gate since 3.2 (green on every run of 3.1.1 and 3.2, D7's rule).
          - browser: chromium
            mode: keyboard
            experimental: false
          - browser: webkit
            mode: keyboard
            experimental: false
          # The release language: the whole game in French, no English default of the engine visible.
          - browser: chromium
            mode: fr
            experimental: false
          # The Canvas painter (D10, since 3.4): the whole game drawn by it, its rooms against the DOM references, the
          # frame rate with the CPU slowed 4×.
          - browser: chromium
            mode: canvas
            experimental: false
    env:
      RUN: ${{ fromJSON(needs.plan.outputs.plan).e2e }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::e2e (${{ matrix.browser }}, ${{ matrix.mode }}) not needed by the plan (nothing the sample game's browser rows play changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npx playwright install --with-deps ${{ matrix.browser }}) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      # The two-entry build (game + Studio demo) `check` made from this very commit.
      - if: env.RUN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - if: env.RUN == 'true'
        run: npm run preview -- --port 5173 &
      - if: env.RUN == 'true'
        run: for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
      - if: env.RUN == 'true'
        run: npm run e2e -- http://127.0.0.1:5173/ --game demo --prod ${{ matrix.mode == 'generic' && '--generic' || matrix.mode == 'keyboard' && '--generic --keyboard --save --no-indexeddb --axe' || matrix.mode == 'fr' && '--generic --lang fr' || matrix.mode == 'canvas' && '--generic --renderer canvas' || '--save --axe' }}
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_OUT: /tmp/e2e-${{ matrix.browser }}
      # The weight budget against the bytes really transferred (since 3.4): a first visit with the warm-ups off, every
      # request inside the asset graph's prediction, the total within 10% of it.
      - if: env.RUN == 'true' && matrix.browser == 'chromium' && matrix.mode == 'full'
        run: npm run e2e:weight -- http://127.0.0.1:5173/
      # The music director (since 3.5): thirty minutes rendered offline without a sample of drift, 100 changes of mix
      # without a click, the theme's stems in the game; then each browser's real-time jitter (< 20 ms).
      - if: env.RUN == 'true' && matrix.browser == 'chromium' && matrix.mode == 'full'
        run: npm run e2e:music -- http://127.0.0.1:5173/ --only=offline && npm run e2e:music -- http://127.0.0.1:5173/ --only=game && npm run e2e:music -- http://127.0.0.1:5173/ --only=live --live=chromium
      - if: env.RUN == 'true' && matrix.browser == 'webkit' && matrix.mode == 'generic'
        run: npm run e2e:music -- http://127.0.0.1:5173/ --only=live --live=webkit
      # Visual baselines (since 3.4): every room of the sample game, still, against tests/visual/demo/*.png.
      - if: env.RUN == 'true' && matrix.browser == 'chromium' && matrix.mode == 'full'
        run: npm run e2e:visual -- http://127.0.0.1:5173/
      - if: env.RUN == 'true' && matrix.mode == 'canvas'
        run: npm run e2e:visual -- http://127.0.0.1:5173/ --renderer=canvas
      - if: env.RUN == 'true' && matrix.mode == 'canvas'
        run: npm run e2e:perf -- http://127.0.0.1:5173/ --renderer=canvas && npm run e2e:perf -- http://127.0.0.1:5173/ --renderer=dom
      # The Studio edits a stage without JSON by hand (since 3.4): on its dev server, the Stage form, the diff, the
      # write, the game sees it, undo puts the file back.
      - if: env.RUN == 'true' && matrix.mode == 'canvas'
        run: STUDIO=1 npx vite --port 5317 --strictPort &
      - if: env.RUN == 'true' && matrix.mode == 'canvas'
        run: for i in $(seq 1 60); do curl -sf http://127.0.0.1:5317/__studio/ > /dev/null && break; sleep 1; done && npm run e2e:studio -- http://127.0.0.1:5317/__studio/
      # The accessibility and storage gates (since 3.3): axe on the conversation menu, the map, the save / load slots,
      # the confirmations and every built-in minigame; every minigame won at the keyboard; an older save (v2
      # localStorage, a 3.1.0 IndexedDB record) upgraded and resumed. Blocking in Chromium (keyboard row) and WebKit.
      - if: env.RUN == 'true' && ((matrix.browser == 'chromium' && matrix.mode == 'keyboard') || (matrix.browser == 'webkit' && matrix.mode == 'generic'))
        run: npm run e2e:a11y -- http://127.0.0.1:5173/
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_OUT: /tmp/e2e-${{ matrix.browser }}/a11y
      # The PWA (programme §4.5, since 4.1.8): the offline game (every file of the plan in the cache), the update
      # (the banner, the save kept, the new worker in charge), an update whose fetch fails (no banner, the old worker
      # keeps serving) and a reinstall (worker and caches gone, installed again, the save kept); the script serves
      # the build itself to publish the second one. Chromium and WebKit here, Firefox in its own job below. WebKit
      # cannot navigate offline under Playwright: that last step reports "skipped", accepted here, never counted as
      # a proof; a person checks Safari offline before each release (docs/dev/SAFARI-OFFLINE.md, docs/dev/passes/).
      - if: env.RUN == 'true' && ((matrix.browser == 'chromium' && matrix.mode == 'full') || (matrix.browser == 'webkit' && matrix.mode == 'generic'))
        run: npm run e2e:pwa -- --serve=dist --update --interrupted --reinstall ${{ matrix.browser == 'webkit' && '--allow-skip' || '' }}
        env:
          E2E_BROWSER: ${{ matrix.browser }}
      - if: env.RUN == 'true' && !((matrix.browser == 'chromium' && matrix.mode == 'full') || (matrix.browser == 'webkit' && matrix.mode == 'generic'))
        run: npm run e2e:pwa -- http://127.0.0.1:5173/ ${{ matrix.browser == 'webkit' && '--allow-skip' || '' }}
        env:
          E2E_BROWSER: ${{ matrix.browser }}
      - if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-${{ matrix.browser }}-${{ matrix.mode }}
          path: |
            /tmp/e2e-${{ matrix.browser }}
            tests/visual
  # The PWA in Firefox (4.1.8): install, warm-up, update, interrupted update, reinstall and the offline game, the
  # same script as the e2e job's; the only Firefox gate (SUPPORT says what the rest of the game claims there: nothing).
  # It plays the dist `check` built (4.1.9). Gate: `pwaFirefox` (the worker, the storage, the PWA script, the engine).
  pwa-firefox:
    needs: [plan, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN: ${{ fromJSON(needs.plan.outputs.plan).pwaFirefox }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::pwa-firefox not needed by the plan (no PWA path changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npx playwright install --with-deps firefox) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - if: env.RUN == 'true'
        run: npm run e2e:pwa -- --serve=dist --update --interrupted --reinstall
        env:
          E2E_BROWSER: firefox
  # The same results in Node, Chromium, WebKit and Firefox (4.1.16, plan §10): the canonical text, the speedrun
  # generator and proof (with a resume after a chunk), the Remix worlds and wheels, and Remix and Time Attack together
  # (each world policy recorded in four runtimes, verified in a new process and by the Bridge's isolated worker).
  # Every pull request: four bundles evaluated in blank pages, a few minutes.
  cross-runtime:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: for i in 1 2 3; do (npx playwright install --with-deps chromium webkit firefox) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: npm run e2e:canonical
      - run: npm run e2e:remix
      - run: npm run e2e:speedrun
      - run: npm run e2e:remix-speedrun
  # The engine as another project uses it (3.9): packed, a game created from the template outside the repository,
  # installed from the tarball, verified, built and played to its ending (scripts/fresh-install.mjs). Its own build
  # (the created game's). Gate: `freshInstall` (the packages, the template, the Bridge, the authoring tools).
  fresh-install:
    needs: [plan, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN: ${{ fromJSON(needs.plan.outputs.plan).freshInstall }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::fresh-install not needed by the plan (no package, template or authoring path changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (pip install -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npx playwright install --with-deps chromium) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: npm run fresh-install

  # The four archives installed outside the repository on three systems (4.1.18, plan §7): packed here (the candidate
  # installs its own), a 4.1.17 game moved to them, the Bridge and a connector scenario from their archives.
  external-consumer:
    needs: [plan, check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUN: ${{ fromJSON(needs.plan.outputs.plan).freshInstall }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::external-consumer not needed by the plan (no package, template or authoring path changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (pip install -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 15
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: npm run external-consumer

  # A game made on the previous release moved to this engine (4.0): created with that release's tarball, a save made by
  # it, then this engine installed, migrate --check, verify, build, and the old save played to the end. Its own build.
  # Gate: `upgrade` (saves, migrations, storage, the packages, the authoring tools).
  upgrade:
    needs: [plan, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ fromJSON(needs.plan.outputs.plan).upgrade }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::upgrade not needed by the plan (no save, migration or package path changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (pip install -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: npm run upgrade-check -- --from=previous

  # The reference chapter (games/reference, since 3.4): the second real game, the 3.4 exit gate. Built, proved whole and
  # chapter by chapter, played to the end at the keyboard in Chromium and WebKit, in French with no English default
  # visible; its rooms against their references, its staged market at 30 fps or more with the CPU slowed 4×, its first
  # visit inside the weight prediction. Its own build (GAME=reference). Gate: `reference` (its content, the painters,
  # the music, the e2e scripts, the authoring tools).
  reference:
    needs: [plan, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      GAME: reference
      RUN: ${{ fromJSON(needs.plan.outputs.plan).reference }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::reference (${{ matrix.browser }}) not needed by the plan (nothing the reference chapter plays changed)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.RUN == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (pip install -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: for i in 1 2 3; do (npx playwright install --with-deps ${{ matrix.browser }}) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      # validate --release measures the stems with ffprobe (3.6).
      - if: env.RUN == 'true'
        run: bash scripts/ci-ffmpeg.sh
        timeout-minutes: 20
      - if: env.RUN == 'true'
        run: npm run build:game
      - if: env.RUN == 'true' && matrix.browser == 'chromium'
        run: npm run prove:game
      - if: env.RUN == 'true'
        run: npm run preview -- --port 5175 &
      - if: env.RUN == 'true'
        run: for i in $(seq 1 60); do curl -sf http://127.0.0.1:5175/ > /dev/null && break; sleep 1; done
      - if: env.RUN == 'true'
        run: npm run e2e -- http://127.0.0.1:5175/ --game reference --prod --keyboard
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_OUT: /tmp/e2e-reference-${{ matrix.browser }}
      - if: env.RUN == 'true' && matrix.browser == 'chromium'
        run: npm run e2e -- http://127.0.0.1:5175/ --game reference --prod --lang fr && npm run e2e -- http://127.0.0.1:5175/ --game reference --prod --generic --axe --save
        env:
          E2E_OUT: /tmp/e2e-reference-fr
      - if: env.RUN == 'true' && matrix.browser == 'chromium'
        run: npm run e2e:visual -- http://127.0.0.1:5175/ && npm run e2e:perf -- http://127.0.0.1:5175/ && npm run e2e:weight -- http://127.0.0.1:5175/
      # Two scores and two bridges (3.7): a transition planned, restored, stopped, under transitionPeakMB; in WebKit
      # too since 3.8.
      - if: env.RUN == 'true'
        run: npm run e2e:music -- http://127.0.0.1:5175/ --only=reference --browser=${{ matrix.browser }}
      # The default verb (4.0): a double tap goes through a door, talks to a character; an item from the bag is given or used.
      - if: env.RUN == 'true'
        run: npm run e2e:taps -- http://127.0.0.1:5175/ --browser=${{ matrix.browser }}
      - if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reference-${{ matrix.browser }}
          path: /tmp/e2e-reference-*
  # Every job's result in one check (4.1.9): each must be `success` (a job the plan spares succeeds in a step), mutation
  # may be `skipped` where it does not run (an ordinary pull request). The candidate single required check: the
  # ruleset still requires the seventeen names until a few runs of this job have been green (the maintainer's move).
  pr-gate:
    needs: [plan, check, coverage, mutation-plan, mutation, mutation-merge, reality-xcheck, connectors, bridge-postgres, studio-hosted, reality, node-24, windows, second-game, e2e, pwa-firefox, fresh-install, external-consumer, upgrade, reference, cross-runtime]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          MUTATION: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          bad=0
          for row in $(echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'); do
            job=${row%%=*}; result=${row#*=}
            case "$job" in mutation|mutation-plan|mutation-merge)
              if [ "$result" = skipped ] && [ "$MUTATION" != true ]; then
                echo "✔ $job: skipped (main, the nightly, release-check and full-ci only)"; continue
              fi ;;
            esac
            if [ "$result" = success ]; then echo "✔ $job"; else echo "::error::$job: $result"; bad=1; fi
          done
          exit $bad
  pages:
    # 4.1.16: Pages waits for the terminal gate, not a subset (no deployment with Firefox PWA, a proof or mutation red).
    # `always()` and the gate's own result: the implicit success() also reads pr-gate's ancestors, some of which are
    # skipped by design (mutation, jobs the plan spares), and would skip Pages forever.
    needs: [pr-gate]
    if: always() && github.ref == 'refs/heads/main' && needs.pr-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
