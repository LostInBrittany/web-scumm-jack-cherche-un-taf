name: nightly
# The abstractions against the explicit search on 500 random games of each kind (3.6, tools/audit-corpus.ts), in four
# shards since 3.7: too slow for every push. A divergence fails the run; it is a solver bug to fix before the next
# release.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'How many seeds'
        default: '500'
permissions:
  contents: read
jobs:
  # The npm names (4.1.20 PR 3b, D34: squatting accepted until 4.2): still free, or ours. Never gating: a name
  # taken by someone else is said as a warning and in the summary, for the maintainers to act. Since 4.5.2 (D53) the
  # packages are the organisation's scoped ones, ours when an owner of the organisation publishes them; the unscoped
  # names of 4.2.5 to 4.5.1 are pointers, an owner's and deprecated toward the scoped ones, except
  # create-quest-n-click, a relay (an owner's, never deprecated: `npx create-quest-n-click` runs @quest-n-click/create);
  # the former names (D47) are watched as before, since a reader may still look for them.
  npm-names:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - shell: bash
        run: |
          # The organisation's owners' npm users exactly (`lostinbrittany <mail>`), never a prefix: OWNERS in
          # tools/release/preflight.mjs (npm shows an organisation's members to its members only, and CI has no
          # token).
          OWNERS='"(lostinbrittany|wanoo)( <|")'
          for p in @quest-n-click/engine @quest-n-click/create @quest-n-click/bridge @quest-n-click/connectors @quest-n-click/studio-server web-scumm create-web-scumm web-scumm-bridge web-scumm-connectors web-scumm-studio-server; do
            # A 404 is free, any other error said.
            if who=$(npm view "$p" maintainers --json 2>/tmp/npm-err); then
              if echo "$who" | grep -Eq "$OWNERS"; then echo "✔ $p: ours"; else echo "::warning title=npm name taken::$p is published by someone else: $who"; echo "- $p: TAKEN by $who" >> "$GITHUB_STEP_SUMMARY"; fi
            elif grep -q E404 /tmp/npm-err; then
              echo "✔ $p: still free"
            else
              echo "::warning title=npm name unknown::$p: npm view failed: $(tail -1 /tmp/npm-err)"
            fi
          done
          # The pointers: an owner's and deprecated. Free is said (to reserve), never a failure.
          for p in quest-n-click quest-n-click-bridge quest-n-click-connectors quest-n-click-studio-server; do
            if view=$(npm view "$p" maintainers deprecated --json 2>/tmp/npm-err); then
              if ! echo "$view" | grep -Eq "$OWNERS"; then echo "::warning title=npm name taken::$p is published by someone else: $view"; echo "- $p: TAKEN by $view" >> "$GITHUB_STEP_SUMMARY"
              elif ! echo "$view" | grep -q '"deprecated"'; then echo "::warning title=npm pointer not deprecated::$p is ours but not deprecated (npm deprecate, D53)"; echo "- $p: ours, NOT DEPRECATED" >> "$GITHUB_STEP_SUMMARY"
              else echo "✔ $p: ours, a deprecated pointer"; fi
            elif grep -q E404 /tmp/npm-err; then
              echo "::notice title=npm pointer free::$p is not reserved yet (D53)"; echo "- $p: free, to reserve as a pointer" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=npm name unknown::$p: npm view failed: $(tail -1 /tmp/npm-err)"
            fi
          done
          # The relay: an owner's, not deprecated.
          p=create-quest-n-click
          if view=$(npm view "$p" maintainers deprecated --json 2>/tmp/npm-err); then
            if ! echo "$view" | grep -Eq "$OWNERS"; then echo "::warning title=npm name taken::$p is published by someone else: $view"; echo "- $p: TAKEN by $view" >> "$GITHUB_STEP_SUMMARY"
            elif echo "$view" | grep -q '"deprecated"'; then echo "::warning title=npm relay deprecated::$p is the relay to @quest-n-click/create and must not be deprecated (D53)"; echo "- $p: relay DEPRECATED" >> "$GITHUB_STEP_SUMMARY"
            else echo "✔ $p: ours, the relay"; fi
          elif grep -q E404 /tmp/npm-err; then
            echo "::notice title=npm relay free::$p is not published yet (the relay, D53)"; echo "- $p: free, to publish as the relay" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=npm name unknown::$p: npm view failed: $(tail -1 /tmp/npm-err)"
          fi
  # The heavy solver tests (4.1.3): the abstraction audits, the canonical owner, the memo and the ownership proofs, the
  # reference chapter's proof. Minutes each on a shared runner, so they run here every night, not on every push.
  # 4.1.17: one file after the other (`--no-file-parallelism`), so the four partition workers have the cores and the
  # durations measured mean something; 150 minutes (about 13 on a laptop, the runner is several times slower).
  heavy:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - run: npm run test:heavy
  # The connectors' fuzz harness (4.1.9, tools/fuzz-connectors.ts): seeded mutations for a minute per
  # connector, a new seed each night (the run number). Reported, not gating, until it has been green two nights in a
  # row (plan 4.1.9 §4 branch 6); then `continue-on-error` goes.
  fuzz-connectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - run: node --expose-gc --import tsx tools/fuzz-connectors.ts --cases=1000000 --seconds=60 --seed=${{ github.run_number }}
  # Four shards of the seeds, one per job (3.7): the corpus is parallel by seed, the jobs run side by side.
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      # bash -o pipefail: a divergence still fails the job through tee.
      - shell: bash
        run: |
          # The seeds of this shard: tools/audit-corpus.ts splits the total evenly, never past it (3.7.1).
          npm run audit:corpus -- --shard=${{ matrix.shard }}/4 --total=${{ github.event.inputs.seeds || '500' }} --json=corpus-${{ matrix.shard }}.json | tee corpus-${{ matrix.shard }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-${{ matrix.shard }}
          path: corpus-${{ matrix.shard }}.*
          if-no-files-found: ignore
  # The shards added up: tried, compared, partial and diverged per kind, kept as an artifact and on the run's page. A
  # missing shard, or seeds run twice, fails it (3.7.1).
  merge:
    needs: corpus
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: corpus-*
          merge-multiple: true
      - shell: bash
        run: npx tsx tools/audit-corpus.ts --merge corpus-*.json --total=${{ github.event.inputs.seeds || '500' }} --json=corpus.json | tee corpus.txt
      - if: always()
        shell: bash
        run: |
          if [ -f corpus.txt ]; then { echo '```'; cat corpus.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus
          path: |
            corpus.json
            corpus.txt
          if-no-files-found: ignore
  # The mutation matrix (4.1.20 PR 2a, plan §7.3): every shard of every gated set, and the measured ones (gating nothing), from
  # tools/mutation-shards.ts — no workflow writes its list of sets by hand (tests/mutate-shards.test.ts).
  mutation-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - id: m
        shell: bash
        run: |
          echo "matrix=$(npx tsx tools/mutation-shards.ts --matrix=nightly)" >> "$GITHUB_OUTPUT"
  # One job per shard (4.1.17: a set's length never cuts another's result short; 4.1.20: a long set in shards). Each
  # job has a Postgres service; only the set that needs one is given its URL (the others' tests would run their
  # Postgres cases too and judge mutants otherwise than the gate).
  mutation:
    needs: [mutation-plan]
    name: mutation (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: ${{ !matrix.gated }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bridge" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: npm run test:mutation:core -- --set=${{ matrix.set }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --fresh | tee mutation-${{ matrix.name }}.txt
        shell: bash
        env:
          BRIDGE_PG_URL: ${{ matrix.pg && 'postgres://bridge:bridge@127.0.0.1:5432/bridge' || '' }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.name }}
          path: |
            mutation-${{ matrix.name }}.txt
            .cache/mutation/report-${{ matrix.set }}.shard-${{ matrix.shard }}of${{ matrix.shards }}.json
          include-hidden-files: true
          if-no-files-found: ignore
  # Each set's shards merged into its report (`mutation-<set>`, the artifact the gate, the baseline and the summaries
  # read): a shard missing, doubled, cancelled or of other inputs fails it, so no gate passes on part of a set.
  mutation-merge:
    needs: [mutation-plan, mutation]
    if: always() && needs.mutation-plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: shards
      - shell: bash
        run: |
          code=0
          for set in $(echo '${{ needs.mutation-plan.outputs.matrix }}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log([...new Set(JSON.parse(s).include.filter(e=>e.gated).map(e=>e.set))].join(' ')))"); do
            npx tsx tools/mutate.ts --set="$set" --merge --from=shards || code=1
            mkdir -p merged/.cache/mutation && { cp ".cache/mutation/report-$set.json" merged/.cache/mutation/ 2>/dev/null || true; }
          done
          # The measured sets (gating nothing): merged and kept, a failure said, never the nightly's.
          for set in $(echo '${{ needs.mutation-plan.outputs.matrix }}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log([...new Set(JSON.parse(s).include.filter(e=>!e.gated).map(e=>e.set))].join(' ')))"); do
            npx tsx tools/mutate.ts --set="$set" --merge --from=shards || echo "::warning::the measured set $set is not clean (it gates nothing)"
            cp ".cache/mutation/report-$set.json" merged/.cache/mutation/ 2>/dev/null || true
          done
          exit $code
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-merged
          path: merged
          include-hidden-files: true
          if-no-files-found: ignore
  # The Bridge under load (4.1.10, tools/bridge-load.ts, docs/dev/BENCH-BRIDGE.md): three instances, 1 000 players,
  # 50 000 proposals, on SQLite and on Postgres 16 (a service container pinned by digest), each a job of its own since
  # 4.1.17. In 4.1.16 the SQLite row was given BRIDGE_STORE="" and never opened SQLite, and its missing report failed
  # nothing. Now each names its store; tools/load-report.ts refuses a report that is missing, incomplete, or of another
  # backend or commit. A lost or doubled signal, a gap in a sequence or an incomplete stream fails the run.
  bridge-load-sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - run: npm run bridge:load -- --store=sqlite --out=bridge-load-sqlite.json
      # The speedrun leaderboard at 100 000 runs (4.1.17, plan §6.3): latency, memory and SQL plan, bounded.
      - run: npm run runs:load -- --store=sqlite --runs=100000 --max-p95-ms=2000 --max-rss-mb=512 --out=runs-load-sqlite.json
      - if: always()
        run: npx tsx tools/load-report.ts bridge-load-sqlite.json --store=sqlite --commit=${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-load-sqlite
          path: |
            bridge-load-sqlite.json
            runs-load-sqlite.json
          if-no-files-found: error
  bridge-load-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - run: npm run bridge:load -- --store=postgres://bridge:bridge@127.0.0.1:5432/bridge --out=bridge-load-postgres.json
      # The speedrun leaderboard at 100 000 runs (4.1.17, plan §6.3): latency, memory and SQL plan, bounded.
      - run: npm run runs:load -- --store=postgres://bridge:bridge@127.0.0.1:5432/bridge --runs=100000 --max-p95-ms=2000 --max-rss-mb=512 --out=runs-load-postgres.json
      - if: always()
        run: npx tsx tools/load-report.ts bridge-load-postgres.json --store=postgres --commit=${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-load-postgres
          path: |
            bridge-load-postgres.json
            runs-load-postgres.json
          if-no-files-found: error
  # The proof matrix of 4.1.13 "Solver Research" (docs/dev/PROOF-MATRIX.md, tools/prove-matrix.ts): each of the twelve instances proved
  # in its own job under the runner's budget (20 min, 10 000 000 states, 4 GB of heap). A false verdict fails the job;
  # an instance out of budget is `unknown`, the gap report, not a failure. Never on a pull request.
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        instance: [c11, c12, c13, c14, c15, c16, o21, o22, o23, o24, o25, o26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - shell: bash
        run: npm run prove:matrix -- --only=${{ matrix.instance }} --time=1200 --mem=4096 --json=matrix-${{ matrix.instance }}.json --profile=profile-${{ matrix.instance }}.md | tee matrix-${{ matrix.instance }}.txt
      - if: always()
        shell: bash
        run: |
          if [ -f matrix-${{ matrix.instance }}.txt ]; then { echo '```'; cat matrix-${{ matrix.instance }}.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-${{ matrix.instance }}
          path: |
            matrix-${{ matrix.instance }}.*
            profile-${{ matrix.instance }}.md
          if-no-files-found: ignore
  # The cross-runtime checks at more seeds than a pull request runs (4.1.16, plan §10): 500 seeds of every Remix mode
  # and wheel, the speedrun's checks, and Remix and Time Attack together, in Node, Chromium, WebKit and Firefox.
  cross-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: for i in 1 2 3; do (npx playwright install --with-deps chromium webkit firefox) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: npm run e2e:canonical
      - run: npm run e2e:remix -- --seeds=500
      - run: npm run e2e:speedrun
      - run: npm run e2e:remix-speedrun
  # The speedrun worker in its container profile (4.1.17, plan §10.3): the reference run verified inside, a hostile
  # script refused the network and the host's files and secrets and killed by its own timeout, then a run again.
  worker-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      # The worker's image by its digest (4.1.19, plan §6.2), the same one the Bridge's image starts from.
      - run: for i in 1 2 3; do (docker pull mirror.gcr.io/library/node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - run: npm run e2e:worker-container -- --image=mirror.gcr.io/library/node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
