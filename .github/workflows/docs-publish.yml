name: docs-publish
# The documentation's publication (4.5.0 "Wiki", docs/dev/PLAN-4.5-WIKI.md §4.5, ADR 0030). The only workflow that
# writes the GitHub wiki and the publication record (`publication.json`, in the wiki's repository, copied to Pages'
# `/docs/publication.json`); Pages' `/docs/` is assembled by ci.yml from the released archives alone. Nothing on main
# publishes by itself.
#
#   - From release.yml (`workflow_call`), by a job that `needs` the release job, so after `ship verify` passed; never
#     on `release: published`. It promotes the archive the release carries, revision r1: its sha256 is the one the
#     release job verified, the candidate's manifest names it, release.yml attested it; `check --publish` runs on the
#     tag with the test report of the candidate run the tag names. A pre-release (`-rc.N`) publishes `/docs/<v-rc>/`
#     only: no wiki, no latest, no record.
#   - By hand (`workflow_dispatch`, `-f version=<v> -f mode=<mode> [-f target=<v>[-r<n>]]`), each mode from one ref only
#     (checked here and again by `wiki -- publish --ref`):
#       revision  from `docs/<v>` (made from the tag, documentation changes only): the next `r<n>`, built twice,
#                 attested, released as the immutable pre-release `docs-v<v>-r<n>` (never latest), then promoted. A
#                 revision whose release went out but whose record did not is completed by running it again: the
#                 rebuilt archive must have the released sha256, or the run is refused;
#       rollback  from main: `target=<v>[-r<n>]`, a published archive promoted again, backwards on purpose;
#       promote   from main: `target=<v>[-r<n>]`, a published archive promoted forwards, or the current state again
#                 (never backwards: that is a rollback). The recovery when a release's docs-publish was cancelled or
#                 replaced while pending (see the concurrency below): promote that release's r1. Re-running the
#                 cancelled job works too while its run can be re-run;
#       preview   from main: the bootstrap's preview (§4.5.3), refused once a release ≥ 4.5.0 exists; a rerun on the
#                 same commit reuses its release when the bytes are the same.
# No GitHub Pages any more (4.5.2, D52): the project's website, https://quest-n-click.cleverapps.io, shows the latest
# documentation; release.yml's site-revalidate job calls its POST /api/revalidate after this workflow (hourly otherwise).
on:
  workflow_call:
    inputs:
      version:
        description: The version released (from the tag, an rc's suffix included)
        type: string
        required: true
      tag:
        description: The release tag
        type: string
        required: true
      sha:
        description: The tag's commit
        type: string
        required: true
      candidate:
        description: The candidate run the tag names
        type: string
        required: true
      archive-sha256:
        description: The sha256 of the documentation archive the release job verified
        type: string
        required: true
      revision:
        description: The doc revision (r1 for a release)
        type: string
        required: false
        default: r1
    secrets:
      WIKI_DEPLOY_KEY:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'The version whose documentation is published (e.g. 4.5.0)'
        required: true
      mode:
        description: 'revision (from docs/<v>), rollback or promote (from main, with target), preview (from main)'
        type: choice
        options: [revision, rollback, promote, preview]
        required: true
      target:
        description: 'rollback and promote: the published archive, <version> or <version>-r<n>'
        required: false
        default: ''
permissions:
  contents: write
  # The candidate's test report is an artifact of its run.
  actions: read
  # A doc revision's archive is attested as a release's files are.
  id-token: write
  attestations: write
jobs:
  publish:
    # The wiki and the record are shared by every publication: one at a time, the running one never cancelled
    # (§4.5.2). On the job, as a called workflow honours it there. GitHub keeps ONE pending run per group, whatever
    # `cancel-in-progress` says: a run queued behind a pending one replaces it, and the replaced one is cancelled. The
    # recovery: re-run the cancelled job, or dispatch `mode=promote` with its version.
    concurrency:
      group: docs-publish
      cancel-in-progress: false
    # The job that holds the wiki's deploy key and writes: the maintainer gives this environment its required
    # reviewers and its branch policy (main, docs/* and, since 4.5.3, the tags v*: release.yml runs on a tag's push,
    # #291), and may keep WIKI_DEPLOY_KEY there.
    environment: docs-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      # Called from release.yml, the `github` context is the caller's (event `push`, ref the tag, since 4.5.3): the call is
      # known by its inputs, which a dispatch does not have.
      CALLED: ${{ inputs.archive-sha256 != '' && inputs.sha != '' }}
      DISPATCHED_MODE: ${{ inputs.mode }}
      TARGET: ${{ inputs.target }}
      RUN_REF: ${{ github.ref }}
      RUN_ID: ${{ github.run_id }}
      IN_TAG: ${{ inputs.tag }}
      IN_SHA: ${{ inputs.sha }}
      IN_CANDIDATE: ${{ inputs.candidate }}
      IN_SHA256: ${{ inputs.archive-sha256 }}
      IN_REVISION: ${{ inputs.revision }}
    steps:
      - name: The inputs, and the ref each mode may write from
        run: |
          echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' || { echo "::error::not a version: $VERSION"; exit 1; }
          if [ "$CALLED" = true ]; then mode=release; else mode="$DISPATCHED_MODE"; fi
          case "$mode" in
            revision) want="refs/heads/docs/$VERSION" ;;
            # A release from its tag's push (4.5.3, #291): release.yml runs there, no longer on main's workflow_run.
            release)
              [ "$IN_TAG" = "v$VERSION" ] || { echo "::error::tag $IN_TAG is not v$VERSION"; exit 1; }
              want="refs/tags/$IN_TAG" ;;
            rollback|promote|preview) want=refs/heads/main ;;
            *) echo "::error::unknown mode: $mode"; exit 1 ;;
          esac
          [ "$RUN_REF" = "$want" ] || { echo "::error::a $mode publishes from $want, not from $RUN_REF"; exit 1; }
          case "$mode" in
            rollback|promote)
              case "$TARGET" in "$VERSION"|"$VERSION"-r[0-9]*) ;; *) echo "::error::target $TARGET is not $VERSION or $VERSION-r<n>"; exit 1 ;; esac ;;
            *) [ -z "$TARGET" ] || { echo "::error::target is for rollback and promote"; exit 1; } ;;
          esac
          echo "MODE=$mode" >> "$GITHUB_ENV"
          echo "::notice::docs-publish: $mode of $VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          # The preview's tag rule and the source-set rule read the history and every release tag (§4.5.2, §4.5.3).
          fetch-depth: 0
      - name: Every tag
        run: git fetch --force --tags origin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20

      # ——— A release (from release.yml): the archive it carries, checked, then promoted.
      - name: The release's archive, checked against its sums, its candidate and its attestation
        if: env.MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$IN_TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$IN_SHA" || { echo "::error::$TAG does not point to $IN_SHA"; exit 1; }
          a="quest-n-click-docs-$VERSION.tar.gz"
          mkdir -p .release
          gh release download "$TAG" -R "$REPO" -D .release -p "$a" -p "quest-n-click-$TAG-SHA256SUMS" -p "quest-n-click-$TAG-candidate.json"
          got=$(sha256sum ".release/$a" | cut -d' ' -f1)
          test "$got" = "$IN_SHA256" || { echo "::error::$a is $got, release.yml verified $IN_SHA256"; exit 1; }
          grep -Eq "^$got  $a\$" ".release/quest-n-click-$TAG-SHA256SUMS" || { echo "::error::$a is not in the release's SHA256SUMS"; exit 1; }
          node -e 'const m=require("./.release/quest-n-click-"+process.argv[1]+"-candidate.json"); const e=m.artifacts.find(a=>a.name==="docs/quest-n-click-docs-"+process.argv[2]+".tar.gz"); if(!e||e.sha256!==process.argv[3]){console.error("::error::the candidate manifest does not name this archive");process.exit(1)}' "$TAG" "${VERSION%%-*}" "$got"
          # Signed by release.yml, as the site's /docs/ requires (tools/wiki/pages.ts attestationTries).
          npm run -s wiki -- attest --repo "$REPO" --tag "$TAG" --file ".release/$a"
          { echo "ARCHIVE=.release/$a"; echo "ARCHIVE_SHA=$got"; echo "PRODUCT_TAG=$TAG"; echo "CANDIDATE=$IN_CANDIDATE"; echo "REVISION=$IN_REVISION"; echo "RELEASE_TAG=$TAG"; } >> "$GITHUB_ENV"

      # ——— A doc revision (from docs/<v>): the next r<n>, or the last one to complete.
      - name: The doc revision to publish
        if: env.MODE == 'revision'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          WIKI_DEPLOY_KEY: ${{ secrets.WIKI_DEPLOY_KEY }}
        run: |
          case "$VERSION" in *-*) echo "::error::a pre-release has no doc revision: fix it in the next rc"; exit 1 ;; esac
          git rev-parse "refs/tags/v$VERSION^{commit}" >/dev/null || { echo "::error::no tag v$VERSION"; exit 1; }
          next=$(npm run -s wiki -- next-revision --version "$VERSION" --repo "$REPO")
          r=${next%% *}; state=${next#* }
          echo "$r" | grep -Eq '^r[1-9][0-9]*$' || { echo "::error::no revision decided ($next)"; exit 1; }
          [ "$state" = existing ] && echo "::notice::docs-v$VERSION-$r is released but not recorded: this run completes it"
          { echo "REVISION=$r"; echo "RELEASE_TAG=docs-v$VERSION-$r"; echo "PRODUCT_TAG=v$VERSION"; } >> "$GITHUB_ENV"
          echo "CANDIDATE=$(node tools/release/candidate.mjs run-of "v$VERSION")" >> "$GITHUB_ENV"

      # ——— A rollback or a promotion: an archive already published, downloaded from its release and checked.
      - name: The published archive to promote
        if: env.MODE == 'rollback' || env.MODE == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          r=${TARGET#"$VERSION"}; r=${r#-}; r=${r:-r1}
          if [ "$r" = r1 ]; then tag="v$VERSION"; a="quest-n-click-docs-$VERSION.tar.gz"; sums="quest-n-click-$tag-SHA256SUMS"
          else tag="docs-v$VERSION-$r"; a="quest-n-click-docs-$VERSION-$r.tar.gz"; sums="quest-n-click-docs-$VERSION-$r-SHA256SUMS"; fi
          mkdir -p .release
          gh release download "$tag" -R "$REPO" -D .release -p "$a" -p "$sums"
          got=$(sha256sum ".release/$a" | cut -d' ' -f1)
          grep -Eq "^$got  $a\$" ".release/$sums" || { echo "::error::$a does not match its release's SHA256SUMS"; exit 1; }
          npm run -s wiki -- attest --repo "$REPO" --tag "$tag" --file ".release/$a"
          { echo "ARCHIVE=.release/$a"; echo "ARCHIVE_SHA=$got"; echo "REVISION=$r"; echo "RELEASE_TAG=$tag"; } >> "$GITHUB_ENV"

      # ——— The publication level, on the product: the candidate's own test report, downloaded from its run.
      - name: The candidate's test report
        if: env.MODE == 'release' || env.MODE == 'revision'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$CANDIDATE" || { echo "::error::$PRODUCT_TAG names no candidate run"; exit 1; }
          gh run download "$CANDIDATE" -R "$REPO" -n candidate-test-report -D .test-report
      - name: check --publish
        if: env.MODE == 'release' || env.MODE == 'revision' || env.MODE == 'preview'
        run: |
          if [ "$MODE" = preview ]; then
            npm run -s wiki -- check --publish --product-ref HEAD --state preview
          else
            state=published; case "$VERSION" in *-*) state=candidate ;; esac
            npm run -s wiki -- check --publish --product-ref "$PRODUCT_TAG" --doc-ref HEAD --state "$state" --candidate "$CANDIDATE" --test-report .test-report/vitest.json
          fi

      # ——— Build and release a doc revision or the preview (immutable, never latest).
      - name: The archive of this revision, built twice
        if: env.MODE == 'revision' || env.MODE == 'preview'
        shell: bash
        run: |
          mkdir -p .archive .cache/docs-again
          if [ "$MODE" = preview ]; then
            a="quest-n-click-docs-$VERSION-preview.tar.gz"
            flags=(--preview --product-version "$VERSION")
            { echo "RELEASE_TAG=docs-v$VERSION-preview-$(git rev-parse HEAD | cut -c1-12)"; echo "REVISION=r1"; } >> "$GITHUB_ENV"
          else
            a="quest-n-click-docs-$VERSION-$REVISION.tar.gz"
            # The product's candidate report: the revision's guarantees are rendered "executed" as the release's were.
            flags=(--revision "$REVISION" --product-version "$VERSION" --product-commit "$(git rev-parse "$PRODUCT_TAG^{commit}")" --candidate "$CANDIDATE" --test-report .test-report/vitest.json)
          fi
          npm run -s wiki -- archive --out ".archive/$a" --build-id "$RUN_ID" "${flags[@]}"
          npm run -s wiki -- archive --out ".cache/docs-again/$a" --build-id "$RUN_ID" "${flags[@]}"
          cmp ".archive/$a" ".cache/docs-again/$a" || { echo "::error::the archive is not reproducible"; exit 1; }
          (cd .archive && sha256sum "$a" > "${a%.tar.gz}-SHA256SUMS")
          { echo "ARCHIVE=.archive/$a"; echo "ARCHIVE_SHA=$(sha256sum ".archive/$a" | cut -d' ' -f1)"; } >> "$GITHUB_ENV"
      # A release that already exists (a rerun, a run to complete): reused when its archive has these very bytes,
      # refused otherwise; it is never replaced. (A rebuild keeps its bytes only with the same build id: completing a
      # revision is a re-run of its own job, or a promotion of it.)
      - name: An existing release of this revision
        if: env.MODE == 'revision' || env.MODE == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" -R "$REPO" >/dev/null 2>&1; then
            a=$(basename "$ARCHIVE")
            mkdir -p .existing
            gh release download "$RELEASE_TAG" -R "$REPO" -D .existing -p "$a"
            got=$(sha256sum ".existing/$a" | cut -d' ' -f1)
            [ "$got" = "$ARCHIVE_SHA" ] || { echo "::error::$RELEASE_TAG exists with another archive ($got, rebuilt $ARCHIVE_SHA): a doc revision is immutable; nothing published (promote it with mode=promote if it is the one to publish)"; exit 1; }
            npm run -s wiki -- attest --repo "$REPO" --tag "$RELEASE_TAG" --file ".existing/$a"
            echo "::notice::$RELEASE_TAG exists with these very bytes: reused"
            echo "REUSED=true" >> "$GITHUB_ENV"
          fi
      - if: (env.MODE == 'revision' || env.MODE == 'preview') && env.REUSED != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .archive/quest-n-click-docs-*.tar.gz
      - name: The release of this revision
        if: (env.MODE == 'revision' || env.MODE == 'preview') && env.REUSED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release that is never latest, on this commit, made as a draft then published: immutable, like the
          # product's releases (a new revision is a new release, §4.5.4).
          what=$([ "$MODE" = preview ] && echo preview || echo "$REVISION")
          gh release create "$RELEASE_TAG" -R "$REPO" --draft --prerelease --latest=false --target "$(git rev-parse HEAD)" \
            --title "Documentation $VERSION $what" \
            --notes "The documentation of quest'n'click $VERSION, $what (docs/dev/PLAN-4.5-WIKI.md §4.5.4). Promotion is recorded in publication.json, never here."
          gh release upload "$RELEASE_TAG" -R "$REPO" .archive/*
          gh release edit "$RELEASE_TAG" -R "$REPO" --draft=false

      # ——— The wiki and the record. A pre-release stops before: /docs/<v-rc>/ only, from the release itself.
      - name: The wiki and publication.json
        if: "!contains(inputs.version, '-')"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The deploy key with write access to the wiki: the expected way (GITHUB_TOKEN is not expected to push to a
          # wiki; the A1 spike confirms it).
          WIKI_DEPLOY_KEY: ${{ secrets.WIKI_DEPLOY_KEY }}
        run: |
          flags=()
          [ "$MODE" = rollback ] && flags+=(--rollback-to "$TARGET")
          npm run -s wiki -- publish --target wiki --mode "$MODE" --ref "$RUN_REF" --version "$VERSION" --revision "$REVISION" \
            --tag "$RELEASE_TAG" --repo "$REPO" --archive "$ARCHIVE" --sha256 "$ARCHIVE_SHA" "${flags[@]}"
      - name: A pre-release leaves the wiki alone
        if: contains(inputs.version, '-')
        run: |
          echo "::notice::$VERSION is a pre-release: /docs/$VERSION/ only; the wiki and latest are unchanged (§4.5.2)"
      # The website takes the publication (4.5.2, D52): release.yml calls its `POST /api/revalidate` once this workflow
      # ends (its site-revalidate job); a run started by hand here is taken at the website's hourly revalidation.
      - name: The website, revalidated by the release
        run: |
          echo "::notice::https://quest-n-click.cleverapps.io takes this publication: release.yml's site-revalidate calls its /api/revalidate after this run (a run by hand: within the hour)"
