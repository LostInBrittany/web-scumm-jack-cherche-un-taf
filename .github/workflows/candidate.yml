name: candidate
# The candidate gate (4.1.17, docs/dev/PLAN-4.1.17-STABILIZATION.md §4.2): every heavy family on one exact SHA, each in
# a job of its own with its own timeout, then `candidate-gate`, which judges them all and writes
# `candidate-manifest.json` (the SHA tested, this run's id, the SHA-256 of each file the release publishes). A stable
# or pre-release tag names one green run of this workflow (`ship tag <v> <sha> --candidate=<run id>`); release.yml
# publishes that run's files after checking every sum. 4.1.16 was tagged before its first heavy run, which went red.
# Since 4.5.3 (#291, D55) this is the release's only test pass: release.yml, started by the tag's push, runs no test of
# its own and checks only that main's `ci` is green on the SHA and that this run is.
#
# Started by hand on main for a SHA (`gh workflow run candidate --ref main -f sha=<full sha>`): the only run a tag may
# name (ship.mjs and release.yml check `workflow_dispatch` from main, so the workflow file judged is main's). A pull
# request runs it too, as information only, when the label `full-ci` is added to it (not on its later pushes). Never on a tag: a tag stands on a candidate already run.
# "Cold": a new runner, a fresh checkout; the solver keeps nothing between runs and no cache but npm's is restored.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'The full SHA to test (empty: the head of the branch it is started on)'
        required: false
        default: ''
  # Only when the `full-ci` label is added (the pull request's head at that moment): a push to the pull request starts
  # no run, which every push did until 4.5.3 (an empty run, every job skipped). Remove and add the label again to rerun.
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  # The SHA every job checks out: the input, the pull request's head, or the branch's head; always written in full.
  target:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha }}
      - id: sha
        env:
          WANT: ${{ github.event.inputs.sha }}
        run: |
          # A SHA given by hand is a full one: a short or wrong value is refused here, not by a later checkout.
          if [ -n "$WANT" ] && ! echo "$WANT" | grep -Eq '^[0-9a-f]{40}$'; then echo "::error::not a full SHA: $WANT"; exit 1; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  # release-check (doctor --release, quality, build, coverage and its strict ratchet, the release gates, the proofs, the
  # Rust cross-check, the packages' dry run, the audits), without the mutation sets, which run as jobs below. Run here
  # only: release.yml ran it again up to 4.5.2, and since 4.5.3 (#291) trusts this run.
  release-core:
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: for i in 1 2 3; do (pip install --require-hashes -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: bash scripts/ci-ffmpeg.sh
        timeout-minutes: 20
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: for i in 1 2 3; do (npx playwright install --with-deps chromium) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: npm run release-check:ci
      # The node suite's report (4.5.0, docs/dev/PLAN-4.5-WIKI.md §4.4.3): release-check:ci writes Vitest's JSON report,
      # and this step writes beside it the commit the suite ran on, the checkout's root and this run's id; `wiki -- check
      # --test-report --candidate <this run>` reads both to call a documented guarantee "executed on <sha>". A report of
      # another commit or another run executes nothing; A5b's publication downloads this artifact from this run.
      - name: The test report of this candidate
        run: |
          test -f .cache/test-report/vitest.json || { echo "::error::no Vitest JSON report from release-check:ci"; exit 1; }
          node -e 'require("fs").writeFileSync(".cache/test-report/commit.json", JSON.stringify({ format: "quest-n-click-test-report", version: 1, commit: process.argv[1], root: process.cwd(), run: process.argv[2] }) + "\n")' "$(git rev-parse HEAD)" "${{ github.run_id }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-test-report
          path: .cache/test-report
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
      # The site as the release publishes it (4.1.20 PR 4, plan §9.2): the very build release-check made, its archive,
      # its assets manifest and the SHA-256 of each file it serves (the surfaces of the people's passes read them).
      # release.yml publishes these files and builds no site of its own to publish.
      - name: The site of this candidate
        run: |
          mkdir -p candidate-site
          tar -czf candidate-site/dist.tar.gz -C dist .
          cp dist/licenses/assets-manifest.json candidate-site/assets-manifest.json
          node tools/release/site-files.mjs --dir=dist --out=candidate-site/site-files.json
      # The game and the Studio's demo for the project's website (4.5.2, D52): built again under /demo/, the shape the
      # engine's Pages job built up to 4.5.1; the website downloads it from the latest release and serves it at /demo/.
      # From 4.5.2 only (tools/release/artifacts.mjs `game:web`); after the site above, which it rebuilds dist over.
      - name: The website's demo of this candidate
        run: |
          # 0: from 4.5.2, built; 10: before 4.5.2, skipped; anything else (the probe itself broke): the step fails, never
          # a green candidate without the build it should have made.
          probe=0
          node -e 'import("./tools/release/candidate.mjs").then((m) => process.exit(m.atLeast(require("./package.json").version, "4.5.2") ? 0 : 10))' || probe=$?
          case "$probe" in
            0)
              BASE_PATH=/demo/ STUDIO=1 VITE_STUDIO_DEMO=1 npm run build:web
              tar -czf candidate-site/web.tar.gz -C dist .
              ;;
            10) echo "::notice::no web.tar.gz before 4.5.2" ;;
            *) echo "::error::the version probe failed (exit $probe): no way to tell whether web.tar.gz is due"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-site
          path: candidate-site
          if-no-files-found: error
          overwrite: true
      # The people's passes committed for this version (4.1.18, the Field Kit): every report checked against its
      # candidate, its evidence and the leak scan; none committed is said, not failed (D12).
      - name: The Field Kit reports of this version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ -d "docs/dev/field/$v" ]; then npm run -s field:check -- --dir="docs/dev/field/$v"; else echo "::notice::no Field Kit report committed for $v"; fi
  # The heavy solver suite three times, each on a new runner (plan §5): the counters and the oracle are deterministic,
  # the durations are what three runs measure. One red attempt is a red candidate.
  heavy:
    needs: target
    runs-on: ubuntu-24.04
    # One file after the other since 4.1.17 (about 13 minutes on a laptop; the runner is several times slower).
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - run: npm run test:heavy -- --reporter=default --reporter=json --outputFile.json=heavy-${{ matrix.attempt }}.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heavy-${{ matrix.attempt }}
          path: heavy-${{ matrix.attempt }}.json
          if-no-files-found: error
          overwrite: true
  # The Bridge under load on each store, in a job of its own (plan §4.1): the report names the backend the store object
  # is, and tools/load-report.ts refuses a report that is missing, incomplete, of another backend or another commit.
  bridge-load-sqlite:
    needs: target
    runs-on: ubuntu-24.04
    # Three loads since 4.1.20 (about 4 minutes each on a runner).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      # Three loads (4.1.20, plan §8.3), each its p95 over its many requests; the proposals and, with them, the speedrun
      # leaderboard at 100 000 runs (4.1.17, plan §6.3: latency, memory and SQL plan, bounded). Every report checked.
      - shell: bash
        run: |
          for i in 1 2 3; do
            npm run bridge:load -- --store=sqlite --out=bridge-load-sqlite-$i.json
            npx tsx tools/load-report.ts bridge-load-sqlite-$i.json --store=sqlite --commit=${{ needs.target.outputs.sha }}
            npm run runs:load -- --store=sqlite --runs=100000 --max-p95-ms=2000 --max-rss-mb=512 --out=runs-load-sqlite-$i.json
          done
          # The first load under the 4.1.19 names, read by the baseline for the counts beside the medians.
          cp bridge-load-sqlite-1.json bridge-load-sqlite.json
          cp runs-load-sqlite-1.json runs-load-sqlite.json
      # The median of the three p95, against the baseline of the same runner and protocol: an alert past 25 %, a failure
      # past the budget or when all three loads are that much slower.
      - run: npx tsx tools/load-median.ts --store=sqlite --out=load-median-sqlite.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-load-sqlite
          path: |
            bridge-load-sqlite*.json
            runs-load-sqlite*.json
            load-median-sqlite.json
          if-no-files-found: error
          overwrite: true
  bridge-load-postgres:
    needs: target
    runs-on: ubuntu-24.04
    # Three loads since 4.1.20 (about 5 minutes each on a runner).
    timeout-minutes: 45
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      # Three loads (4.1.20, plan §8.3), each its p95 over its many requests; the proposals and, with them, the speedrun
      # leaderboard at 100 000 runs (4.1.17, plan §6.3: latency, memory and SQL plan, bounded). Every report checked.
      - shell: bash
        run: |
          for i in 1 2 3; do
            npm run bridge:load -- --store=postgres://bridge:bridge@127.0.0.1:5432/bridge --out=bridge-load-postgres-$i.json
            npx tsx tools/load-report.ts bridge-load-postgres-$i.json --store=postgres --commit=${{ needs.target.outputs.sha }}
            npm run runs:load -- --store=postgres://bridge:bridge@127.0.0.1:5432/bridge --runs=100000 --max-p95-ms=2000 --max-rss-mb=512 --out=runs-load-postgres-$i.json
          done
          # The first load under the 4.1.19 names, read by the baseline for the counts beside the medians.
          cp bridge-load-postgres-1.json bridge-load-postgres.json
          cp runs-load-postgres-1.json runs-load-postgres.json
      # The median of the three p95, against the baseline of the same runner and protocol: an alert past 25 %, a failure
      # past the budget or when all three loads are that much slower.
      - run: npx tsx tools/load-median.ts --store=postgres --out=load-median-postgres.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-load-postgres
          path: |
            bridge-load-postgres*.json
            runs-load-postgres*.json
            load-median-postgres.json
          if-no-files-found: error
          overwrite: true
  # The four runtimes (4.1.16) at the nightly's 500 seeds; the Remix × Time Attack check writes the release's runs
  # (`--out`): five worlds and 4.1.15's schema 1 file, with their manifest. Those very files are published.
  cross-runtime:
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: for i in 1 2 3; do (npx playwright install --with-deps chromium webkit firefox) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: npm run e2e:canonical
      - run: npm run e2e:remix -- --seeds=500
      - run: npm run e2e:speedrun
      - shell: bash
        run: |
          mkdir -p candidate-release
          npm run -s e2e:remix-speedrun -- --out=candidate-release/wsrun | tee candidate-release/e2e-remix-speedrun.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-release
          path: candidate-release
          if-no-files-found: error
          overwrite: true
  # The Remix worlds of the bundled games (4.1.15, D25): each catalogue's every logical world proved (no softlock), the
  # two reports published with the release (a generator mode would publish its sample, never "all seeds"). release.yml
  # proved them itself up to 4.5.2; since 4.5.3 (#291, D55) the candidate does, once, and the release copies its files.
  remix-proof:
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 15
      - name: Remix catalogues, proved
        run: |
          mkdir -p candidate-remix
          GAME=demo npx tsx tools/verify-variants.ts --prove --max=200000 --out=candidate-remix/remix-demo.json
          GAME=reference npx tsx tools/verify-variants.ts --prove --max=200000 --out=candidate-remix/remix-reference.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-remix
          path: candidate-remix
          if-no-files-found: error
          overwrite: true
  # The speedrun worker in its container profile (4.1.17, plan §10.3): the reference run verified inside, a hostile
  # script refused the network and the host's files and secrets and killed by its own timeout, then a run again.
  worker-container:
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      # The worker's image by its digest (4.1.19, plan §6.2), the same one the Bridge's image starts from.
      - run: for i in 1 2 3; do (docker pull mirror.gcr.io/library/node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 8
      - run: npm run e2e:worker-container -- --image=mirror.gcr.io/library/node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
  # The mutation matrix (4.1.20 PR 2a, plan §7.3): every shard of every gated set, from
  # tools/mutation-shards.ts — no workflow writes its list of sets by hand (tests/mutate-shards.test.ts).
  mutation-plan:
    needs: [target]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - id: m
        shell: bash
        run: |
          echo "matrix=$(npx tsx tools/mutation-shards.ts --matrix=gated)" >> "$GITHUB_OUTPUT"
  # One job per shard (4.1.17: a set's length never cuts another's result short; 4.1.20: a long set in shards). Each
  # job has a Postgres service; only the set that needs one is given its URL (the others' tests would run their
  # Postgres cases too and judge mutants otherwise than the gate).
  mutation:
    needs: [target, mutation-plan]
    name: mutation (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bridge" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - id: inputs
        run: echo "hash=$(npx tsx tools/mutate.ts --set=${{ matrix.set }} --hash)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mutation
          key: mutation-${{ matrix.name }}-${{ steps.inputs.outputs.hash }}
      - run: npm run test:mutation:core -- --set=${{ matrix.set }} --shard=${{ matrix.shard }}/${{ matrix.shards }} | tee mutation-${{ matrix.name }}.txt
        shell: bash
        env:
          BRIDGE_PG_URL: ${{ matrix.pg && 'postgres://bridge:bridge@127.0.0.1:5432/bridge' || '' }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.name }}
          path: |
            mutation-${{ matrix.name }}.txt
            .cache/mutation/report-${{ matrix.set }}.shard-${{ matrix.shard }}of${{ matrix.shards }}.json
          include-hidden-files: true
          if-no-files-found: ignore
  # Each set's shards merged into its report (`mutation-<set>`, the artifact the gate, the baseline and the summaries
  # read): a shard missing, doubled, cancelled or of other inputs fails it, so no gate passes on part of a set.
  mutation-merge:
    needs: [target, mutation-plan, mutation]
    if: always() && needs.mutation-plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: shards
      - shell: bash
        run: |
          code=0
          for set in $(echo '${{ needs.mutation-plan.outputs.matrix }}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log([...new Set(JSON.parse(s).include.filter(e=>e.gated).map(e=>e.set))].join(' ')))"); do
            npx tsx tools/mutate.ts --set="$set" --merge --from=shards || code=1
            mkdir -p merged/.cache/mutation && { cp ".cache/mutation/report-$set.json" merged/.cache/mutation/ 2>/dev/null || true; }
          done

          exit $code
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-merged
          path: merged
          include-hidden-files: true
          if-no-files-found: ignore
  # The four packages, packed once (4.1.18, plan §7): what the release publishes and what `external-consumer` installs
  # on three systems. Never packed again downstream: the manifest gives each its SHA-256 and release.yml checks it.
  pack:
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 15
      - run: |
          node scripts/pack.mjs --out=pack --publish-dry-run --build-id=${{ github.run_id }}
          mkdir -p candidate-pack && cp pack/*.tgz candidate-pack/ && ls -l candidate-pack
      # Their SBOMs (4.1.19, plan §6.3), from what the archives hold: the Bridge's and the connectors' own locks, the
      # engine's dependencies as the root lock resolves them, the creator's one dependency by its archive's SHA-256.
      - run: node scripts/sbom.mjs --pack=candidate-pack --out=candidate-sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-pack
          path: candidate-pack
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-sbom
          path: candidate-sbom
          if-no-files-found: error
          overwrite: true
  # The Bridge's qualification image, built once from the candidate's archive and the image's versioned lock (4.1.19,
  # plan §6.2): saved with its three identities (config digest, OCI manifest digest, the archive's SHA-256) and its SBOM.
  # deployment-smoke loads it and checks them; the release publishes these very files.
  # The documentation archive (4.5.0, docs/dev/PLAN-4.5-WIKI.md §4.5.4): the bundle, the rendered site and the wiki
  # of this commit, revision r1, built twice and compared byte for byte; the release attaches this very file and
  # docs-publish promotes it without building anything again. Named by package.json's version (an rc's tag adds its
  # suffix when release.yml publishes it). Built after release-core, from its test report (§4.4.3): a guarantee whose
  # test passed in this run is rendered "executed on <sha>". The report is an input of the archive, not a clock: the
  # two builds read the same files and give the same bytes.
  docs-archive:
    needs: [target, release-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 15
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-test-report
          path: .cache/candidate-test-report
      - name: The documentation archive, built twice
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p candidate-docs .cache/docs-again
          npm run -s wiki -- archive --out "candidate-docs/quest-n-click-docs-$v.tar.gz" --build-id ${{ github.run_id }} --revision r1 --candidate ${{ github.run_id }} --test-report .cache/candidate-test-report/vitest.json
          npm run -s wiki -- archive --out ".cache/docs-again/quest-n-click-docs-$v.tar.gz" --build-id ${{ github.run_id }} --revision r1 --candidate ${{ github.run_id }} --test-report .cache/candidate-test-report/vitest.json
          cmp "candidate-docs/quest-n-click-docs-$v.tar.gz" ".cache/docs-again/quest-n-click-docs-$v.tar.gz" || { echo "::error::the documentation archive is not reproducible: two builds differ"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-docs
          path: candidate-docs
          if-no-files-found: error
          overwrite: true
  image:
    needs: [target, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-pack
          path: candidate-pack
      - run: for i in 1 2 3; do (node scripts/bridge-image.mjs build --tarballs=candidate-pack --out=candidate-image) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 12
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-image
          path: candidate-image
          if-no-files-found: error
          overwrite: true
  # Those very archives installed outside the repository (scripts/external-consumer.mjs): Ubuntu, macOS and Windows on
  # Node 22, Ubuntu on Node 24 too; a 4.1.17 game moved to them, the Bridge (SQLite, and Postgres on Ubuntu) and a
  # connector scenario from their own archives.
  external-consumer:
    needs: [target, pack]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The older engine a game is created on (4.1.19, plan §7.4): the previous stable, the one before it, and a
          # pre-release (its tarball named without the suffix), each checked against its release's sums.
          - { os: ubuntu-24.04, node: 22, pg: true, from: 4.1.17 }
          - { os: ubuntu-24.04, node: 24, pg: false, from: 4.1.16 }
          - { os: macos-15, node: 22, pg: false, from: 4.1.18-rc.1 }
          - { os: windows-2025, node: 22, pg: false, from: 4.1.17 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: for i in 1 2 3; do (pip install --require-hashes -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 15
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-pack
          path: candidate-pack
      - if: matrix.pg
        name: A Postgres for the Bridge's line
        run: |
          docker run -d --name consumer-pg -e POSTGRES_USER=bridge -e POSTGRES_PASSWORD=bridge -e POSTGRES_DB=bridge -p 127.0.0.1:55432:5432 mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
          for i in $(seq 1 30); do docker exec consumer-pg pg_isready -U bridge && break; sleep 2; done
          echo "CONSUMER_PG_URL=postgres://bridge:bridge@127.0.0.1:55432/bridge" >> "$GITHUB_ENV"
      - run: node scripts/external-consumer.mjs --tarballs=candidate-pack --from=${{ matrix.from }}
  # The four connectors played end to end from their archive (4.1.19, plan §8.2): email by webhook and by IMAP (a
  # server of the script's own), Telnet, SSH and Open Badge, each against a Bridge from its archive. Linux only:
  # `external-consumer` proves the packages on three systems, this proves what the connectors do once started.
  connector-archive-e2e:
    needs: [target, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-pack
          path: candidate-pack
      - run: node scripts/connector-archive-e2e.mjs --tarballs=candidate-pack
  # The Bridge's qualification profile (4.1.18, plan §8) built from this candidate's own `quest-n-click-bridge` archive:
  # three instances behind HTTPS on Postgres, an instance killed with proposals in flight, the tenants apart, backup,
  # the topology destroyed and restored (scripts/ops-qualify.mjs; its report kept with the run).
  deployment-smoke:
    needs: [target, pack, image]
    runs-on: ubuntu-24.04
    # The full profile (4.1.20): about 25 minutes with the 4.1.17 store, the lease takeover and the quota's minute.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 15
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-pack
          path: candidate-pack
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-image
          path: candidate-image
      # The full profile on a run started by hand, the one a tag may name (4.1.20, plan §8.1): every step, on this
      # candidate's archives and image, for this run; candidate-gate refuses less. A pull request's run (`full-ci`,
      # information only) keeps `--short` (4.1.19: the profile without the lease takeover, the quota's minute and the
      # 4.1.17 store).
      - shell: bash
        env:
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'short' }}
        run: npm run ops:qualify -- --tarballs=candidate-pack --image-from=candidate-image --candidate-run=${{ github.run_id }} $([ "$PROFILE" = short ] && echo --short) --out=deployment-smoke
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-smoke
          path: deployment-smoke
          if-no-files-found: ignore
          overwrite: true
  # What a large backup costs in memory (4.1.20, plan §6.5, tools/backup-memory.ts): backups of 64, 128 and 256 MiB,
  # the peak resident memory of the export, the read and the restore of the candidate's own Bridge (its archive,
  # installed from its lock), their durations on SQLite and on Postgres, one byte and one row above the bounds refused.
  # A peak above the qualification container's 512 MiB is said (a warning), the bounds' refusals gate.
  backup-memory:
    needs: [target, pack]
    strategy:
      fail-fast: false
      matrix:
        store: [sqlite, postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 15
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-pack
          path: candidate-pack
      - name: The candidate's Bridge, from its archive and its lock
        shell: bash
        run: |
          mkdir -p .cache/bridge && tar -xzf candidate-pack/quest-n-click-bridge-[0-9]*.tgz -C .cache/bridge --strip-components=1
          (cd .cache/bridge && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
      - shell: bash
        env:
          STORE: ${{ matrix.store == 'postgres' && 'postgres://bridge:bridge@127.0.0.1:5432/bridge' || 'sqlite' }}
        run: npx tsx tools/backup-memory.ts --store="$STORE" --bridge=.cache/bridge --sizes=64,128,256 --out=backup-memory-${{ matrix.store }}.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-memory-${{ matrix.store }}
          path: backup-memory-${{ matrix.store }}.json
          if-no-files-found: error
          overwrite: true
  # The signing of 4.2's tags, rehearsed with no secret (4.1.20 PR 3b, plan §11.1, tools/release/signing.mjs): an
  # ephemeral SSH key made here, a signed tag of this commit never pushed, `git verify-tag` against a temporary
  # allowed_signers, the key and the tag destroyed; the report goes into the manifest.
  signing-rehearsal:
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: mkdir -p candidate-signing && node tools/release/signing.mjs rehearse --out=candidate-signing/signing-rehearsal.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-signing
          path: candidate-signing
          if-no-files-found: error
          overwrite: true
  # The README's quick start as a reader copies it (4.1.19, plan §11.1): its lines run as written outside the repository,
  # the archive URL (which exists only after the tag) pointed at this candidate's own archive.
  readme-quickstart:
    needs: [target, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: for i in 1 2 3; do (pip install --require-hashes -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 10
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-pack
          path: candidate-pack
      - run: node scripts/readme-quickstart.mjs --tarballs=candidate-pack
  # The Studio Server as an operator installs it (4.2.1, plan §7 row 9): this candidate's engine and Studio Server
  # archives in an empty folder, a game imported, served on the loopback (its probes, the Studio's page, the API), the
  # worker answering its probe; its own dependencies found whether npm hoists or nests them
  # (scripts/studio-install-smoke.mjs).
  studio-install-smoke:
    needs: [target, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-pack
          path: candidate-pack
      # CPython 3.13, Clever Cloud's (4.2.3 PR 0): the smoke installs requirements.txt as the worker's hook does.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: for i in 1 2 3; do (node scripts/studio-install-smoke.mjs --tarballs=candidate-pack --python) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 15
  # The terminal gate: every job above `success` (a skipped or cancelled job is red), then the manifest of this run.
  candidate-gate:
    needs: [target, release-core, heavy, bridge-load-sqlite, bridge-load-postgres, cross-runtime, remix-proof, worker-container, mutation-plan, mutation, mutation-merge, pack, docs-archive, image, external-consumer, connector-archive-e2e, deployment-smoke, backup-memory, signing-rehearsal, readme-quickstart, studio-install-smoke]
    # A pull request without `full-ci` skips `target`: then there is no candidate to judge, and no red check either.
    if: always() && needs.target.result != 'skipped'
    # The manifest's provenance attestation (4.1.19, plan §6.5): only this job may sign, and only the manifest.
    permissions:
      contents: read
      id-token: write
      attestations: write
      # The run's own jobs, read for the baseline's durations (4.1.19, plan §12.2).
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Every job succeeded
        # `shell: bash` is `bash -eo pipefail`: without it the pipe took tee's exit, and a red job left this gate green
        # (candidate 37998053206, 9 October 2026: `✖ mutation: failure` printed, the step passed).
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node tools/release/candidate.mjs gate | tee gate.txt
      # The qualification a tag may stand on (4.1.20, plan §8.1): the full profile, of this SHA, for this run, every step
      # passed, on this candidate's archives and image. A pull request's run is information only and is not judged here.
      - name: The full qualification of this candidate
        if: github.event_name == 'workflow_dispatch'
        run: node tools/release/candidate.mjs qualification artifacts/deployment-smoke/ops-qualify.json --sha=${{ needs.target.outputs.sha }} --run=${{ github.run_id }} --pack=artifacts/candidate-pack --image=artifacts/candidate-image
      # The release's exact baseline (4.1.19, plan §12.2): read from this run's artifacts and jobs, nothing measured
      # again; under candidate-release/baseline it enters the manifest, is attested with it and published by release.yml.
      - name: The baseline of this candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No fallback: `actions: read` is granted, so a failed call is a fault to see, not a baseline without durations.
          # A 5xx tried again and every page read (4.1.20 PR 3b: the jobs listing answered 502 for an hour on 13 Oct).
          node tools/release/run-jobs.mjs --repo=${{ github.repository }} --run=${{ github.run_id }} --out=jobs.json
          node tools/release/baseline.mjs --dir=artifacts --sha=${{ needs.target.outputs.sha }} --run=${{ github.run_id }} --jobs=jobs.json --out=artifacts/candidate-release/baseline
          cat artifacts/candidate-release/baseline/*.md >> "$GITHUB_STEP_SUMMARY"
      - name: The manifest of this candidate
        run: |
          # The packages beside the runs (4.1.18): one manifest, one SHA-256 per file the release publishes.
          if [ -d artifacts/candidate-pack ]; then mkdir -p artifacts/candidate-release/pack && cp artifacts/candidate-pack/*.tgz artifacts/candidate-release/pack/; fi
          # The image (its archive, identities and SBOM) and the four archives' SBOMs (4.1.19): in the same manifest.
          if [ -d artifacts/candidate-image ]; then mkdir -p artifacts/candidate-release/image && cp artifacts/candidate-image/* artifacts/candidate-release/image/; fi
          if [ -d artifacts/candidate-sbom ]; then mkdir -p artifacts/candidate-release/sbom && cp artifacts/candidate-sbom/* artifacts/candidate-release/sbom/; fi
          # The site (4.1.20): its archive, assets manifest and file digests, made once by release-core.
          if [ -d artifacts/candidate-site ]; then mkdir -p artifacts/candidate-release/site && cp artifacts/candidate-site/* artifacts/candidate-release/site/; fi
          # The documentation archive (4.5.0): in the manifest, so the release's sums and attestations cover it.
          if [ -d artifacts/candidate-docs ]; then mkdir -p artifacts/candidate-release/docs && cp artifacts/candidate-docs/* artifacts/candidate-release/docs/; fi
          # The signing rehearsal's report (4.1.20 PR 3b).
          if [ -d artifacts/candidate-signing ]; then mkdir -p artifacts/candidate-release/signing && cp artifacts/candidate-signing/* artifacts/candidate-release/signing/; fi
          # The Remix catalogues proved (4.5.3, #291): the release publishes these two reports, proved nowhere else.
          if [ -d artifacts/candidate-remix ]; then mkdir -p artifacts/candidate-release/remix && cp artifacts/candidate-remix/* artifacts/candidate-release/remix/; fi
          # The surfaces of the people's passes (4.1.20 PR 4, ADR 0024), from the files above and the checkout's
          # docs/dev/surfaces.json, before the manifest: attested with it. A file in no surface fails here.
          # No site, no surfaces: refused here, before anything is attested (second reading of PR 4).
          test -f artifacts/candidate-release/site/site-files.json || { echo "::error::no site-files.json from release-core: the surfaces cannot be written"; exit 1; }
          mkdir -p artifacts/candidate-release/surfaces
          node tools/field/surfaces.mjs --dir=artifacts/candidate-release --out=artifacts/candidate-release/surfaces/qualification-surfaces.json
          node tools/release/candidate.mjs manifest --sha=${{ needs.target.outputs.sha }} --run=${{ github.run_id }} --dir=artifacts/candidate-release --out=candidate-manifest.json
          node tools/release/candidate.mjs check candidate-manifest.json --sha=${{ needs.target.outputs.sha }} --run=${{ github.run_id }} --dir=artifacts/candidate-release
      - if: always()
        name: Summary
        shell: bash
        run: |
          {
            echo "## Candidate ${{ github.run_id }}"
            echo
            echo "- SHA tested: \`${{ needs.target.outputs.sha }}\`"
            echo "- Tag with: \`npm run ship -- tag <version> ${{ needs.target.outputs.sha }} --candidate=${{ github.run_id }}\`"
            echo
            echo '### Jobs'
            echo '```'
            cat gate.txt 2>/dev/null || echo 'not judged'
            echo '```'
            echo '### Load (backend actually opened)'
            # Each load once per store (4.1.20: three loads, their files -1 to -3; the median is said below).
            for f in artifacts/bridge-load-*/runs-load-sqlite.json artifacts/bridge-load-*/runs-load-postgres.json; do
              [ -f "$f" ] && node -e "const r=require('./$f'); console.log('- leaderboard on ' + r.store + ': ' + r.runs + ' runs, p95 ' + r.latencyMs.p95 + ' ms (bound ' + r.bounds.p95Ms + '), ' + r.rssMb.after + ' MB')"
            done
            for f in artifacts/bridge-load-*/bridge-load-sqlite.json artifacts/bridge-load-*/bridge-load-postgres.json; do
              [ -f "$f" ] && node -e "const r=require('./$f'); console.log('- ' + r.store + ': ' + r.proposals + ' proposals, ' + r.perSecond + '/s, p95 ' + r.latencyMs.p95 + ' ms, gaps ' + r.gaps + ', commit ' + String(r.commit).slice(0, 12))"
            done
            echo '### Solver (heavy, per attempt)'
            for f in artifacts/heavy-*/heavy-*.json; do
              [ -f "$f" ] && node -e "const r=require('./$f'); const t=r.testResults.flatMap(x=>x.assertionResults); console.log('- ' + '$f'.split('/').pop() + ': ' + r.numPassedTests + '/' + r.numTotalTests + ' passed, ' + Math.round(t.reduce((s,x)=>s+(x.duration||0),0)/1000) + ' s of tests')"
            done
            echo '### Mutation (input hash, score)'
            for f in artifacts/mutation-*/.cache/mutation/report-*.json; do
              # A shard's report is part of its set's, merged in mutation-merged (4.1.20): the set is said once.
              case "$f" in *.shard-*) continue ;; esac
              [ -f "$f" ] && node -e "const r=require('./$f'); console.log('- ' + r.set + ': ' + r.status + ', ' + r.killed + '/' + r.total + ' killed or named, input hash ' + r.inputHash + ', commit ' + String(r.commitSha).slice(0, 12))"
            done
            echo '### Files for the release'
            [ -f candidate-manifest.json ] && node -e "for (const a of require('./candidate-manifest.json').artifacts) console.log('- ' + a.name + ' ' + a.sha256.slice(0, 16))" || echo '- none (the gate is red)'
            echo '### Human passes still open'
            echo "- $(ls docs/dev/passes/*.md | sort -V | tail -1): every row is a human's to record (D18); none is marked here"
            echo '### Artifacts missing'
            for f in artifacts/bridge-load-*/load-median-*.json; do
              [ -f "$f" ] && node -e "const r=require('./$f'); for (const k of ['proposals','leaderboard']) console.log('- ' + r.store + ' ' + k + ', three loads: median p95 ' + r[k].medianMs + ' ms (' + r[k].minMs + '–' + r[k].maxMs + ')' + (r[k].baseline && r[k].baseline.ratio ? ', ×' + r[k].baseline.ratio + ' the baseline' : '') + (r[k].alert ? ' ⚠' : ''))"
            done
            for a in candidate-release candidate-pack candidate-sbom candidate-image candidate-remix heavy-1 heavy-2 heavy-3 bridge-load-sqlite bridge-load-postgres backup-memory-sqlite backup-memory-postgres deployment-smoke; do [ -d "artifacts/$a" ] || echo "- $a"; done
          } >> "$GITHUB_STEP_SUMMARY"
      # Who wrote the manifest (4.1.19, plan §6.5): signed by this run, after every job succeeded. A Field Kit bundle
      # carries the attestation, so anyone can check it offline (npm run field:verify-bundle).
      # A pull request's run (full-ci) is information only: never attested, so no bundle can stand on it.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: candidate-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-surfaces
          path: artifacts/candidate-release/surfaces
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-baseline
          path: artifacts/candidate-release/baseline
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-manifest
          path: candidate-manifest.json
          if-no-files-found: error
          overwrite: true
