name: release
# A SemVer tag (vMAJOR.MINOR.PATCH[-pre], any major) publishes the GitHub release from the candidate it names. Since
# 4.5.3 (#291, D55) this workflow starts on the tag's push and the candidate is the release's only test pass: the tag
# runs no `ci` of its own, and nothing is tested again here. The release job asks instead that the commit is on main's
# first-parent line, that main's `ci` succeeded on a push at this very SHA, that the previous stable tag is an ancestor,
# and that the candidate the tag names is green, of this SHA, with every file its manifest lists. Nothing is built here
# either (4.1.20): the files are the candidate's, checked against its manifest and copied under the names
# tools/release/artifacts.mjs gives them; the release is created with the matching CHANGELOG section and the manual
# passes of docs/dev/passes/. Attached: the built game (dist, its licences inside), its assets manifest, the engine's npm
# packages, the Remix catalogues the candidate proved (4.1.15; proved by the candidate since 4.5.3), a complete speedrun
# of the reference chapter verified by `speedrun:verify` (4.1.14), SHA-256 sums, the SBOMs (CycloneDX) and a build
# provenance attestation (`gh attestation verify <file> -R Quest-n-Click/quest-n-click`), and reads it all back once
# published (`ship verify`, 4.1.8). A release that already has files is never overwritten (3.7.1): a new version is a
# new tag. From 4.5.2 (#283, D34) the `npm-stage` job then stages the release's npm packages by trusted publishing, for
# an owner of the organisation to approve with 2FA; nothing is published on npm by this workflow.
# A push trigger runs this file from the tag's own commit, which the gate requires to be one of main's.
on:
  push:
    tags: ['v*']
# One release run per tag at a time (second reading of #122): a re-run, or a tag deleted and pushed again, starts this
# workflow again, and two runs that both saw no release would both make a draft (GitHub lets two drafts share a tag).
# Queued, never cancelled: the second run then finds the first's release and stops.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  attestations: write
  # 4.1.17: the files of the candidate run the tag names are downloaded from that run; 4.5.3: main's ci runs are read.
  actions: read
jobs:
  release:
    # What docs-publish needs (4.5.0): read only when this job succeeded, that is after `ship verify` passed.
    outputs:
      version: ${{ steps.docs.outputs.version }}
      candidate: ${{ steps.docs.outputs.candidate }}
      docs-sha256: ${{ steps.docs.outputs.sha256 }}
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(github.ref_name, '.')
    runs-on: ubuntu-24.04
    # Downloads, checks and uploads (#291): no test suite runs here any more.
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - name: A SemVer tag
        run: |
          echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' || { echo "::notice::$TAG is not a release tag"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      # The tag may have moved between its push and this run (queued behind another): the commit judged is the one this
      # run was started for, and the tag must still point there.
      - name: The tag is the commit this run was started for
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA" || { echo "::error::$TAG points to $(git rev-parse "refs/tags/$TAG^{commit}"), this run was started for $SHA"; exit 1; }
      # 4.5.3 (#291, tools/release/main-ci.mjs): the tag's own `ci` run is gone, main's stands in its place. The commit
      # must be on main's first-parent line (a merge into main, never a topic branch's commit tagged directly), and the
      # `ci` workflow must have succeeded on a push of main at this very SHA. A run still going is not a success: wait
      # for it (`ship tag` does), then re-run this job.
      - name: Main's ci passed on this commit
        run: |
          git fetch --force --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node tools/release/main-ci.mjs "$SHA" --main=refs/remotes/origin/main --repo="$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The previous stable tag is an ancestor
        # 4.1.16: guarded on the file, as every step a tag's commit may predate (up to 4.5.2 release.yml ran from main).
        run: |
          if [ -f tools/release/ancestry.mjs ]; then node tools/release/ancestry.mjs "$TAG" "$SHA"; else echo "::notice::$TAG predates the ancestry check"; fi
      # 4.1.17 (plan §4.2, tools/release/candidate.mjs): from 4.1.17 on a tag names the `candidate` run that tested
      # its commit (`candidate-run: <id>` in its annotation). That run must be green, its manifest this SHA's and that
      # run's, and every file it produced for the release must match its SHA-256: those files are published, never
      # made again. A tag older than 4.1.17 has neither the tool nor the line, and says so.
      - name: The candidate this tag stands on
        run: |
          if [ ! -f tools/release/candidate.mjs ]; then echo "::notice::$TAG predates the candidate gate"; exit 0; fi
          run=$(node tools/release/candidate.mjs run-of "$TAG")
          if [ -z "$run" ]; then
            if node --input-type=module -e "import { requiresCandidate } from './tools/release/candidate.mjs'; process.exit(requiresCandidate(process.argv[1]) ? 1 : 0)" "$TAG"; then
              echo "::notice::$TAG predates the candidate gate"; exit 0
            fi
            echo "::error::$TAG names no candidate run: tag with ship tag … --candidate=<run id>"; exit 1
          fi
          # Started by hand on main: a pull request's run or another branch's judges another copy of candidate.yml.
          got=$(gh run view "$run" --json workflowName,status,conclusion,event,headBranch --jq '[.workflowName, .status, .conclusion, .event, .headBranch] | join(" ")')
          test "$got" = "candidate completed success workflow_dispatch main" || { echo "::error::run $run is \"$got\", not a green candidate started on main"; exit 1; }
          gh run download "$run" -n candidate-manifest -D .candidate-manifest
          gh run download "$run" -n candidate-release -D .candidate
          # 4.1.18 (plan §7): the four packages the candidate packed and installed outside the repository on three
          # systems; a 4.1.17 candidate has none (its manifest names none, the check below says so either way).
          gh run download "$run" -n candidate-pack -D .candidate/pack 2>/dev/null || echo "::notice::run $run packed no packages"
          # 4.1.19 (plan §6.2–6.3): the Bridge's image the candidate built once (archive, identities, SBOM) and the four
          # archives' SBOMs; an older candidate has neither (the check below says whether its manifest named them).
          gh run download "$run" -n candidate-image -D .candidate/image 2>/dev/null || echo "::notice::run $run built no image"
          gh run download "$run" -n candidate-sbom -D .candidate/sbom 2>/dev/null || echo "::notice::run $run made no SBOM"
          # 4.1.19 (plan §12.2): the baseline the candidate wrote of itself; an older candidate wrote none.
          gh run download "$run" -n candidate-baseline -D .candidate/baseline 2>/dev/null || echo "::notice::run $run wrote no baseline"
          # 4.1.20 (plan §9.2): the site the candidate built and the surfaces of the people's passes; an older candidate
          # has neither (its manifest names neither, the check below says so either way).
          gh run download "$run" -n candidate-site -D .candidate/site 2>/dev/null || echo "::notice::run $run kept no site"
          gh run download "$run" -n candidate-surfaces -D .candidate/surfaces 2>/dev/null || echo "::notice::run $run wrote no surfaces"
          gh run download "$run" -n candidate-signing -D .candidate/signing 2>/dev/null || echo "::notice::run $run rehearsed no signing"
          # 4.5.0 (docs/dev/PLAN-4.5-WIKI.md §4.5.4): the documentation archive; an older candidate built none.
          gh run download "$run" -n candidate-docs -D .candidate/docs 2>/dev/null || echo "::notice::run $run built no documentation archive"
          # 4.5.3 (#291): the Remix catalogues the candidate proved, once release.yml stopped proving them itself; an older
          # candidate proved none (its manifest names none, and the release below refuses it: start a new candidate).
          gh run download "$run" -n candidate-remix -D .candidate/remix 2>/dev/null || echo "::notice::run $run proved no Remix catalogue"
          node tools/release/candidate.mjs check .candidate-manifest/candidate-manifest.json --sha="$SHA" --run="$run" --dir=.candidate
          echo "CANDIDATE=$run" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      # Published releases are immutable (4.1.20 PR 3b): one that exists stops this run before anything is made, and
      # changes nothing. A draft left by a run that failed before publishing was never public: it is deleted (its tag
      # stays) and made again from the same candidate. A failed RC is not fixed: it is an rc.N+1.
      - name: Not published yet
        run: |
          # "release not found" is none; any other error of gh (auth, network) stops here rather than read as none.
          # stderr kept apart (second reading of #122): a warning printed beside a success is not a state.
          err=$(mktemp)
          if state=$(gh release view "$TAG" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>"$err"); then :
          elif grep -qi 'release not found' "$err"; then state=none
          else echo "::error::gh release view $TAG: $(cat "$err")"; exit 1; fi
          case "$state" in
            none) ;;
            published) echo "::error::$TAG is published: a published release is never changed (a new version is a new tag)"; exit 1 ;;
            draft)
              # Every draft of the tag, not only the first (two runs may each have left one); bounded, never the tag.
              for i in 1 2 3 4 5; do
                d=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
                [ "$d" = true ] || break
                echo "::notice::$TAG: a draft left by an earlier run, deleted (never published)"
                gh release delete "$TAG" --yes
              done
              [ "$d" != true ] || { echo "::error::$TAG: drafts still there after five deletions"; exit 1; }
              [ "$d" = none ] || { echo "::error::$TAG: published while its drafts were deleted"; exit 1; } ;;
            *) echo "::error::gh release view $TAG: unexpected answer '$state'"; exit 1 ;;
          esac
          # Immutable releases are required from 4.1.20 (`ship verify` asks for GitHub's release attestation, which only
          # an immutable release has): `ship tag` checks it before it pushes the tag, with the maintainer's own access;
          # this job's token cannot read that setting (it needs admin read).
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Node and the repository's dependencies only, for what still runs here: the release notes, speedrun:verify (tsx),
      # the manifest's checks and `ship verify`. No python, ffmpeg or browser (#291): release-check and the mutation
      # sets ran in the candidate this tag names, on this very SHA, and are not run again.
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: node scripts/release-notes.mjs "$TAG" > notes.md
      # The name this tag's files start with (4.2.5, D47): quest-n-click from v4.2.5, web-scumm before; a tag that
      # predates the command is a web-scumm one.
      - name: The release's name
        run: |
          P=$(node tools/release/artifacts.mjs project --tag="$TAG" 2>/dev/null) || { P=web-scumm; echo "::notice::no release name for $TAG: web-scumm"; }
          echo "P=$P" >> "$GITHUB_ENV"
      - name: Build archive, checksum and SBOM
        run: |
          # The site the candidate built and qualified (4.1.20): published as it is, never built again for the release.
          # Its file digests and the surfaces beside it.
          # The Remix worlds of the bundled games (4.1.15, D25): each catalogue's every logical world proved (no
          # softlock), the report published with the release (a generator mode would publish its sample, never "all
          # seeds"). Proved by the candidate since 4.5.3 (#291, its job remix-proof): a candidate without them is refused
          # here, as one without its site is, never proved again in this job.
          for d in site surfaces signing remix; do test -d ".candidate/$d" || { echo "::error::run $CANDIDATE has no candidate-$d: nothing is made again here (start a new candidate)"; exit 1; }; done
          cp .candidate/site/dist.tar.gz "$P-$TAG-dist.tar.gz"
          cp .candidate/site/assets-manifest.json "$P-$TAG-assets-manifest.json"
          cp .candidate/site/site-files.json "$P-$TAG-site-files.json"
          # The website's demo (4.5.2, D52), from the candidates that made it; check-release below says whether the tag
          # must have it (tools/release/artifacts.mjs `game:web`, since 4.5.2).
          if [ -f .candidate/site/web.tar.gz ]; then cp .candidate/site/web.tar.gz "$P-$TAG-web.tar.gz"; WEB="$P-$TAG-web.tar.gz"; else WEB=""; fi
          cp .candidate/surfaces/qualification-surfaces.json "$P-$TAG-surfaces.json"
          # The signing rehearsal's report (4.1.20 PR 3b), as the candidate's manifest lists it.
          cp .candidate/signing/signing-rehearsal.json "$P-$TAG-signing-rehearsal.json"
          extra="$P-$TAG-site-files.json $P-$TAG-surfaces.json $P-$TAG-signing-rehearsal.json${WEB:+ $WEB}"
          # The two Remix reports the candidate wrote (remix/remix-<game>.json), under the tag's names.
          for g in demo reference; do cp ".candidate/remix/remix-$g.json" "$P-$TAG-remix-$g.json"; extra="$extra $P-$TAG-remix-$g.json"; done
          # Since 4.1.20 (plan §8.4) this job makes nothing the candidate made: the archives (packed once, installed
          # outside the repository on three systems), their SBOMs, the Bridge's image (its archive, identities and SBOM)
          # are the candidate's, checked against its manifest above, copied under the names tools/release/artifacts.mjs
          # gives them. A candidate without one of them stops the release here (every tag that still publishes has them).
          # Every archive as it was packed: the packages, and through 4.2.x their old names' aliases (4.2.5, D47); each
          # SBOM under its package's name and the tag (sbom/<name>.cdx.json → <name>-<tag>-sbom.cdx.json).
          for d in pack sbom image; do test -d ".candidate/$d" || { echo "::error::run $CANDIDATE has no candidate-$d: nothing is made again here"; exit 1; }; done
          for f in .candidate/pack/*.tgz; do cp "$f" .; extra="$extra $(basename "$f")"; done
          for f in .candidate/sbom/*.cdx.json; do n="$(basename "$f" .cdx.json)-$TAG-sbom.cdx.json"; cp "$f" "$n"; extra="$extra $n"; done
          cp .candidate/image/$P-bridge-image.tar "$P-bridge-image-$TAG.tar"
          cp .candidate/image/$P-bridge-image.json "$P-bridge-image-$TAG.json"
          cp .candidate/image/$P-bridge-image.cdx.json "$P-bridge-image-$TAG-sbom.cdx.json"
          extra="$extra $P-bridge-image-$TAG.tar $P-bridge-image-$TAG.json $P-bridge-image-$TAG-sbom.cdx.json"
          # The documentation archive (4.5.0, §4.5.4): the candidate's, named by the tag's version (an rc's suffix
          # added), from v4.5.0 on; docs-publish promotes this very file once `ship verify` has read it back.
          for f in .candidate/docs/quest-n-click-docs-*.tar.gz; do
            [ -f "$f" ] || continue
            n="$P-docs-${TAG#v}.tar.gz"
            cp "$f" "$n"
            extra="$extra $n"
            echo "DOCS_ARCHIVE=$n" >> "$GITHUB_ENV"
          done
          # The candidate's baseline (4.1.19): its measures of this very SHA, checked against the manifest above.
          for f in .candidate/baseline/baseline-*.json .candidate/baseline/baseline-*.md; do
            [ -f "$f" ] || continue
            cp "$f" "$P-$TAG-baseline.${f##*.}"
            extra="$extra $P-$TAG-baseline.${f##*.}"
          done
          # A complete speedrun of the reference chapter (4.1.14, its ninth asset): verified by the very tool a
          # leaderboard runs before it is attached; a run the engine of this tag refuses stops the release.
          # Guarded on the file since 4.1.15, when this workflow ran from main's copy for older tags; since 4.5.3 it runs
          # from the tag's own commit, which has it.
          if [ -f tests/fixtures/speedrun/reference-any.wsrun ]; then
            GAME=reference npm run -s speedrun:verify -- tests/fixtures/speedrun/reference-any.wsrun
            cp tests/fixtures/speedrun/reference-any.wsrun "$P-$TAG-reference-any.wsrun"
            extra="$extra $P-$TAG-reference-any.wsrun"
          fi
          # The candidate's runs (4.1.17): the five worlds and 4.1.15's schema 1 file, their manifest, the report of the
          # check that made them, and the candidate's manifest itself; checked against their sums above, copied as they are.
          if [ -n "${CANDIDATE:-}" ]; then
            for f in .candidate/wsrun/*.wsrun; do cp "$f" "$P-$TAG-$(basename "$f")"; extra="$extra $P-$TAG-$(basename "$f")"; done
            cp .candidate/wsrun/wsrun-manifest.json "$P-$TAG-wsrun-manifest.json"
            cp .candidate/e2e-remix-speedrun.txt "$P-$TAG-e2e-remix-speedrun.txt"
            cp .candidate-manifest/candidate-manifest.json "$P-$TAG-candidate.json"
            extra="$extra $P-$TAG-wsrun-manifest.json $P-$TAG-e2e-remix-speedrun.txt $P-$TAG-candidate.json"
          fi
          sha256sum "$P-$TAG-dist.tar.gz" "$P-$TAG-assets-manifest.json" $extra > "$P-$TAG-SHA256SUMS"
          echo "EXTRA_ASSETS=$extra" >> "$GITHUB_ENV"
          # Every file of the release, and none other, as the one manifest lists them (4.1.20, plan §8.4).
          # Guarded on the file, as every step a tag's commit may predate (from 4.1.20 to 4.5.2 this workflow ran from main).
          if [ -f tools/release/artifacts.mjs ]; then
            node tools/release/artifacts.mjs check-release --tag="$TAG" --candidate=.candidate-manifest/candidate-manifest.json --dir=.
          else
            echo "::notice::$TAG predates tools/release/artifacts.mjs: its files are not checked against the manifest"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Every file the release carries (4.1.2): the archives and packages (and, through 4.2.x, their old names'
          # aliases), the manifests, the SBOMs, the sums.
          subject-path: |
            ${{ env.P }}-${{ env.TAG }}-*
            ${{ env.P }}-bridge-image-*
            ${{ env.P }}-docs-*.tar.gz
            *.tgz
            *-${{ env.TAG }}-sbom.cdx.json
      - run: |
          # A pre-release tag (`v4.1.8-rc.1`, 4.1.8) is published as a GitHub pre-release: same files, same checks.
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          # Draft, every file, then published (4.1.20 PR 3b): an immutable release takes its files while it is a draft.
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md $pre
          gh release upload "$TAG" "$P-$TAG-dist.tar.gz" "$P-$TAG-assets-manifest.json" $EXTRA_ASSETS "$P-$TAG-SHA256SUMS"
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
      # What was published, read back (4.1.8): every file downloaded, the sums checked, every attestation verified.
      - run: node tools/release/ship.mjs verify "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
      # The last step: what docs-publish is handed, once everything above (`ship verify` included) passed. A tag
      # before 4.5.0 has no archive: docs-publish is skipped.
      - id: docs
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "candidate=${CANDIDATE:-}" >> "$GITHUB_OUTPUT"
          if [ -n "${DOCS_ARCHIVE:-}" ]; then echo "sha256=$(sha256sum "$DOCS_ARCHIVE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"; fi
  # The npm packages, staged (4.5.2, #283, D34): after the release job succeeded (`ship verify` its last check), the
  # very archives the release carries, read back from it and checked against its SHA256SUMS, are staged on npm by
  # trusted publishing (OIDC: no token, a provenance), engine first, for an owner of the organisation to promote with
  # 2FA (`npm stage approve <id>`, the commands in the run summary). Never `npm publish`. Its own job, beside
  # docs-publish rather than before it: npm being down or a trusted publisher missing must not hold the documentation of
  # a release already published, and this job alone can be re-run (a version already published or staged is skipped).
  # A pre-release tag stages nothing (its archives carry the stable version) and rehearses the OIDC exchange instead.
  npm-stage:
    needs: [release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only what staging needs: read the repository and the release, ask GitHub for an OIDC token.
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      # The exact Node and npm that stage (4.1.20 PR 3b, plan §11.2): npm 11.15.0 at least for `npm stage`, Node
      # 22.14.0 at least; never a range (tests/release-stable.test.ts, ship preflight-stable).
      NPM_PUBLISH_NODE: '22.23.3'
      NPM_PUBLISH_NPM: '11.21.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      # No registry-url: setup-node would write an .npmrc reading NODE_AUTH_TOKEN, and no token is used here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NPM_PUBLISH_NODE }}
      - name: The pinned npm
        run: |
          for i in 1 2 3; do npm install -g "npm@$NPM_PUBLISH_NPM" && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
          test "$(node --version)" = "v$NPM_PUBLISH_NODE" || { echo "::error::node $(node --version), not v$NPM_PUBLISH_NODE"; exit 1; }
          test "$(npm --version)" = "$NPM_PUBLISH_NPM" || { echo "::error::npm $(npm --version), not $NPM_PUBLISH_NPM"; exit 1; }
        timeout-minutes: 10
      - name: The release's archives, as published
        # The files the release carries, the bytes `ship verify` read back, each against the release's SHA256SUMS.
        run: |
          if [ ! -f tools/release/npm-stage.mjs ]; then echo "::notice::$TAG predates npm staging (4.5.2)"; exit 0; fi
          mkdir -p .npm-stage
          gh release download "$TAG" -D .npm-stage -p '*.tgz' -p '*-SHA256SUMS'
          cd .npm-stage
          ls ./*.tgz >/dev/null
          grep -E '  [^ /]+\.tgz$' ./*-SHA256SUMS > tgz.sums
          sha256sum --check --strict tgz.sums
          for f in ./*.tgz; do grep -q "  ${f#./}\$" tgz.sums || { echo "::error::$f is not in the release's SHA256SUMS"; exit 1; }; done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Staged on npm, for an owner's approval
        run: |
          if [ ! -f tools/release/npm-stage.mjs ]; then echo "::notice::$TAG predates npm staging (4.5.2)"; exit 0; fi
          node tools/release/npm-stage.mjs --tag="$TAG" --sha="$SHA" --dir=.npm-stage --repo="$GITHUB_REPOSITORY"
  # The documentation's publication (4.5.0, docs/dev/PLAN-4.5-WIKI.md §4.5.2, ADR 0030): started by `needs`, so only
  # after the release job succeeded, `ship verify` its last check; never by `release: published`, which a release
  # published with GITHUB_TOKEN does not fire. It promotes the archive the release carries (the candidate's, checked
  # again), records it in publication.json and pushes the wiki; an rc publishes `/docs/<v-rc>/` only.
  docs-publish:
    needs: [release]
    if: needs.release.outputs.docs-sha256 != ''
    uses: ./.github/workflows/docs-publish.yml
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    # Only the wiki's deploy key, never every secret of the repository; it may also live in the `docs-publish`
    # environment the called job runs in.
    secrets:
      WIKI_DEPLOY_KEY: ${{ secrets.WIKI_DEPLOY_KEY }}
    with:
      version: ${{ needs.release.outputs.version }}
      tag: v${{ needs.release.outputs.version }}
      sha: ${{ github.sha }}
      candidate: ${{ needs.release.outputs.candidate }}
      archive-sha256: ${{ needs.release.outputs.docs-sha256 }}
      revision: r1
  # The project's website takes the release (4.5.2, D52): its `POST /api/revalidate` (Bearer SITE_REVALIDATE_SECRET)
  # reloads the latest release's docs archive and demo (web.tar.gz) and answers `{ok, changed, source, demo}`. After
  # `ship verify` (the release job) and after docs-publish, whatever docs-publish did (a release without an archive
  # skips it). Never a failure of the release: the website revalidates by itself hourly otherwise. SITE_URL (a
  # repository variable) points a fork elsewhere.
  site-revalidate:
    needs: [release, docs-publish]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions: {}
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://quest-n-click.cleverapps.io' }}
      SITE_REVALIDATE_SECRET: ${{ secrets.SITE_REVALIDATE_SECRET }}
    steps:
      - name: The website, revalidated
        # The website's answer is not trusted as runner output: it is printed between a fresh ::stop-commands:: token
        # and its end (a body holding `::add-mask::` or `::error::` is shown, never acted on), and the warning carries
        # only `.ok` and `.changed`, stripped of newlines and `::`. The token is sent to an https:// address only.
        # Only a network failure or a 5xx is tried again; a 401, 403 or 404 will not change by retrying.
        run: |
          if [ -z "$SITE_REVALIDATE_SECRET" ]; then
            echo "::notice::no SITE_REVALIDATE_SECRET: the website takes the release at its next hourly revalidation"
            exit 0
          fi
          case "$SITE_URL" in
            https://*) ;;
            *) echo "::warning::SITE_URL is not an https:// address: the revalidation token is not sent"; exit 0 ;;
          esac
          url="${SITE_URL%/}/api/revalidate"
          out="$RUNNER_TEMP/revalidate.json"
          field() { { jq -r ".$1" "$out" 2>/dev/null || true; } | tr -d '\r\n:' | head -c 40 || true; }
          for i in 1 2 3; do
            code=$(curl -sS -o "$out" -w '%{http_code}' --max-time 60 -X POST -H "Authorization: Bearer $SITE_REVALIDATE_SECRET" "$url") || code=000
            if [ "$code" = 000 ] || [ "$code" -ge 500 ]; then
              echo "try $i: HTTP $code"
              if [ "$i" = 3 ]; then
                echo "::warning::the website's revalidation failed after 3 tries (HTTP $code): it takes the release at its next hourly revalidation"
                exit 0
              fi
              sleep 20
              continue
            fi
            token=$(openssl rand -hex 16)
            echo "::stop-commands::$token"
            jq -c . "$out" 2>/dev/null || cat "$out"
            echo
            echo "::$token::"
            ok=$(field ok)
            if [ "$code" = 200 ] && [ "$ok" = true ]; then exit 0; fi
            changed=$(field changed)
            echo "::warning::the website's revalidation answered HTTP $code, ok=${ok:-none}, changed=${changed:-none}"
            exit 0
          done
