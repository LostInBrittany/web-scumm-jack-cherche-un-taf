name: release
# A SemVer tag (vMAJOR.MINOR.PATCH[-pre], any major) publishes the GitHub release only once the `ci` workflow of that tag is
# green (check, the browser e2e rows): this workflow runs on ci's completion, not on the tag push. It builds the very
# commit ci tested (`head_sha`), and refuses a tag that no longer points there (moved since). It then re-runs the
# release checks (doctor --release, build, coverage and its strict ratchet, proof, strict playtests, the mutation sets, the
# packages' publish dry run, dependency audits, the dist inventory) and creates the
# release with the matching CHANGELOG section and the manual passes of docs/dev/passes/; the two mutation sets run as jobs
# beside it (4.1.10). Attached: the built game
# (dist, its licences inside), its assets manifest, the engine's npm packages (web-scumm, create-web-scumm, 3.9;
# web-scumm-bridge, 4.1.1), a complete speedrun of the reference chapter verified by `speedrun:verify` (4.1.14),
# SHA-256 sums, an SBOM of the shipped dependencies (CycloneDX) and
# a build provenance attestation (`gh attestation verify <file> -R wanoo/web-scumm`), and reads it all back once published
# (`ship verify`, 4.1.8). A release that already has
# files is never overwritten (3.7.1): a new version is a new tag.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
# One release run per tag at a time (second reading of #122): a rerun of the tag's `ci` fires this workflow again, and
# two runs that both saw no release would both make a draft (GitHub lets two drafts share a tag). Queued, never
# cancelled: the second run then finds the first's release and stops.
concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  attestations: write
  # 4.1.17: the files of the candidate run the tag names are downloaded from that run.
  actions: read
jobs:
  # The mutation matrix (4.1.20 PR 2a, plan §7.3): every shard of every gated set, from
  # tools/mutation-shards.ts — no workflow writes its list of sets by hand (tests/mutate-shards.test.ts).
  mutation-plan:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') && contains(github.event.workflow_run.head_branch, '.')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: A SemVer tag
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' || { echo "::notice::$TAG is not a release tag"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - id: m
        shell: bash
        run: |
          # The tag's own commit says what it gates (4.1.20): a commit that generates no matrix is not released by this
          # workflow, rather than released on a matrix of another commit's sets.
          if [ ! -f tools/mutation-shards.ts ]; then
            echo "::error::this tag's commit has no tools/mutation-shards.ts (4.1.20): release.yml judges a tag on the matrix its own commit generates"
            exit 1
          fi
          echo "matrix=$(npx tsx tools/mutation-shards.ts --matrix=gated)" >> "$GITHUB_OUTPUT"
  # One job per shard (4.1.17: a set's length never cuts another's result short; 4.1.20: a long set in shards). Each
  # job has a Postgres service; only the set that needs one is given its URL (the others' tests would run their
  # Postgres cases too and judge mutants otherwise than the gate).
  mutation:
    needs: [mutation-plan]
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') && contains(github.event.workflow_run.head_branch, '.')
    name: mutation (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bridge" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - id: inputs
        run: echo "hash=$(npx tsx tools/mutate.ts --set=${{ matrix.set }} --hash)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mutation
          key: mutation-${{ matrix.name }}-${{ steps.inputs.outputs.hash }}
      - run: npm run test:mutation:core -- --set=${{ matrix.set }} --shard=${{ matrix.shard }}/${{ matrix.shards }} | tee mutation-${{ matrix.name }}.txt
        shell: bash
        env:
          BRIDGE_PG_URL: ${{ matrix.pg && 'postgres://bridge:bridge@127.0.0.1:5432/bridge' || '' }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.name }}
          path: |
            mutation-${{ matrix.name }}.txt
            .cache/mutation/report-${{ matrix.set }}.shard-${{ matrix.shard }}of${{ matrix.shards }}.json
          include-hidden-files: true
          if-no-files-found: ignore
  # Each set's shards merged into its report (`mutation-<set>`, the artifact the gate, the baseline and the summaries
  # read): a shard missing, doubled, cancelled or of other inputs fails it, so no gate passes on part of a set.
  mutation-merge:
    needs: [mutation-plan, mutation]
    if: always() && needs.mutation-plan.result == 'success' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: shards
      - shell: bash
        run: |
          code=0
          for set in $(echo '${{ needs.mutation-plan.outputs.matrix }}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log([...new Set(JSON.parse(s).include.filter(e=>e.gated).map(e=>e.set))].join(' ')))"); do
            npx tsx tools/mutate.ts --set="$set" --merge --from=shards || code=1
            mkdir -p merged/.cache/mutation && { cp ".cache/mutation/report-$set.json" merged/.cache/mutation/ 2>/dev/null || true; }
          done

          exit $code
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-merged
          path: merged
          include-hidden-files: true
          if-no-files-found: ignore
  release:
    needs: [mutation-plan, mutation, mutation-merge]
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') && contains(github.event.workflow_run.head_branch, '.')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      # The future npm publishing step's exact Node and npm (4.1.20 PR 3b, plan §11.2): npm 11.15.0 at least for
      # `npm stage`, Node 22.14.0 at least; never a range (tests/release-stable.test.ts, ship preflight-stable). Nothing
      # is published to npm in 4.1.x.
      NPM_PUBLISH_NODE: '22.23.3'
      NPM_PUBLISH_NPM: '11.21.0'
    steps:
      - name: A SemVer tag
        run: |
          echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' || { echo "::notice::$TAG is not a release tag"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: The tag is the commit ci tested
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA" || { echo "::error::$TAG points to $(git rev-parse "refs/tags/$TAG^{commit}"), ci tested $SHA"; exit 1; }
      - name: The previous stable tag is an ancestor
        # 4.1.16: guarded on the file, as every step a tag's commit may predate (release.yml runs from main).
        run: |
          if [ -f tools/release/ancestry.mjs ]; then node tools/release/ancestry.mjs "$TAG" "$SHA"; else echo "::notice::$TAG predates the ancestry check"; fi
      # 4.1.17 (plan §4.2, tools/release/candidate.mjs): from 4.1.17 on a tag names the `candidate` run that tested
      # its commit (`candidate-run: <id>` in its annotation). That run must be green, its manifest this SHA's and that
      # run's, and every file it produced for the release must match its SHA-256: those files are published, never
      # made again. A tag older than 4.1.17 has neither the tool nor the line, and says so.
      - name: The candidate this tag stands on
        run: |
          if [ ! -f tools/release/candidate.mjs ]; then echo "::notice::$TAG predates the candidate gate"; exit 0; fi
          run=$(node tools/release/candidate.mjs run-of "$TAG")
          if [ -z "$run" ]; then
            if node --input-type=module -e "import { requiresCandidate } from './tools/release/candidate.mjs'; process.exit(requiresCandidate(process.argv[1]) ? 1 : 0)" "$TAG"; then
              echo "::notice::$TAG predates the candidate gate"; exit 0
            fi
            echo "::error::$TAG names no candidate run: tag with ship tag … --candidate=<run id>"; exit 1
          fi
          # Started by hand on main: a pull request's run or another branch's judges another copy of candidate.yml.
          got=$(gh run view "$run" --json workflowName,status,conclusion,event,headBranch --jq '[.workflowName, .status, .conclusion, .event, .headBranch] | join(" ")')
          test "$got" = "candidate completed success workflow_dispatch main" || { echo "::error::run $run is \"$got\", not a green candidate started on main"; exit 1; }
          gh run download "$run" -n candidate-manifest -D .candidate-manifest
          gh run download "$run" -n candidate-release -D .candidate
          # 4.1.18 (plan §7): the four packages the candidate packed and installed outside the repository on three
          # systems; a 4.1.17 candidate has none (its manifest names none, the check below says so either way).
          gh run download "$run" -n candidate-pack -D .candidate/pack 2>/dev/null || echo "::notice::run $run packed no packages"
          # 4.1.19 (plan §6.2–6.3): the Bridge's image the candidate built once (archive, identities, SBOM) and the four
          # archives' SBOMs; an older candidate has neither (the check below says whether its manifest named them).
          gh run download "$run" -n candidate-image -D .candidate/image 2>/dev/null || echo "::notice::run $run built no image"
          gh run download "$run" -n candidate-sbom -D .candidate/sbom 2>/dev/null || echo "::notice::run $run made no SBOM"
          # 4.1.19 (plan §12.2): the baseline the candidate wrote of itself; an older candidate wrote none.
          gh run download "$run" -n candidate-baseline -D .candidate/baseline 2>/dev/null || echo "::notice::run $run wrote no baseline"
          # 4.1.20 (plan §9.2): the site the candidate built and the surfaces of the people's passes; an older candidate
          # has neither (its manifest names neither, the check below says so either way).
          gh run download "$run" -n candidate-site -D .candidate/site 2>/dev/null || echo "::notice::run $run kept no site"
          gh run download "$run" -n candidate-surfaces -D .candidate/surfaces 2>/dev/null || echo "::notice::run $run wrote no surfaces"
          gh run download "$run" -n candidate-signing -D .candidate/signing 2>/dev/null || echo "::notice::run $run rehearsed no signing"
          node tools/release/candidate.mjs check .candidate-manifest/candidate-manifest.json --sha="$SHA" --run="$run" --dir=.candidate
          echo "CANDIDATE=$run" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      # Published releases are immutable (4.1.20 PR 3b): one that exists stops this run before anything is made, and
      # changes nothing. A draft left by a run that failed before publishing was never public: it is deleted (its tag
      # stays) and made again from the same candidate. A failed RC is not fixed: it is an rc.N+1.
      - name: Not published yet
        run: |
          # "release not found" is none; any other error of gh (auth, network) stops here rather than read as none.
          # stderr kept apart (second reading of #122): a warning printed beside a success is not a state.
          err=$(mktemp)
          if state=$(gh release view "$TAG" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>"$err"); then :
          elif grep -qi 'release not found' "$err"; then state=none
          else echo "::error::gh release view $TAG: $(cat "$err")"; exit 1; fi
          case "$state" in
            none) ;;
            published) echo "::error::$TAG is published: a published release is never changed (a new version is a new tag)"; exit 1 ;;
            draft)
              # Every draft of the tag, not only the first (two runs may each have left one); bounded, never the tag.
              for i in 1 2 3 4 5; do
                d=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
                [ "$d" = true ] || break
                echo "::notice::$TAG: a draft left by an earlier run, deleted (never published)"
                gh release delete "$TAG" --yes
              done
              [ "$d" != true ] || { echo "::error::$TAG: drafts still there after five deletions"; exit 1; }
              [ "$d" = none ] || { echo "::error::$TAG: published while its drafts were deleted"; exit 1; } ;;
            *) echo "::error::gh release view $TAG: unexpected answer '$state'"; exit 1 ;;
          esac
          # Immutable releases are required from 4.1.20 (`ship verify` asks for GitHub's release attestation, which only
          # an immutable release has): `ship tag` checks it before it pushes the tag, with the maintainer's own access;
          # this job's token cannot read that setting (it needs admin read).
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: for i in 1 2 3; do (pip install -r requirements.txt) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      # `npm run doctor -- --release` (first step of release-check) requires ffmpeg and Chromium (4.1.8); release-check
      # opens no browser, so the other two are not installed here.
      # ffmpeg (4.1.15): this workflow runs from main while it checks out the tag's commit, which may predate
      # scripts/ci-ffmpeg.sh, so the same logic is inline here: apt bounded, then a static build from GitHub's CDN.
      - run: |
          command -v ffmpeg >/dev/null 2>&1 && exit 0
          for i in 1 2; do
            if timeout 240 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq ffmpeg; then exit 0; fi
            echo "apt attempt $i failed or hung; retrying" >&2; sleep 10
          done
          echo "apt gave up: a static build from GitHub (BtbN/FFmpeg-Builds)" >&2
          tmp=$(mktemp -d)
          curl -fsSL --retry 3 --max-time 600 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o "$tmp/ffmpeg.tar.xz"
          tar -xJf "$tmp/ffmpeg.tar.xz" -C "$tmp"
          sudo install -m 0755 "$tmp"/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg "$tmp"/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
        timeout-minutes: 20
      - run: for i in 1 2 3; do (npm ci) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      - run: for i in 1 2 3; do (npx playwright install --with-deps chromium) && break; [ "$i" = 3 ] && exit 1; echo "retry $i"; sleep 15; done
        timeout-minutes: 20
      # The mutation sets ran in the `mutation` jobs this one waits for (4.1.10): release-check without them.
      - run: npm run release-check:ci
      - run: node scripts/release-notes.mjs "$TAG" > notes.md
      # The Remix worlds of the bundled games (4.1.15, D25): each catalogue's every logical world proved (no softlock),
      # the report published with the release (a generator mode would publish its sample, never "all seeds"). A tag
      # older than 4.1.15 has no catalogue: the step says so and the release goes on.
      - name: Remix catalogues, proved
        run: |
          if [ -f tools/verify-variants.ts ]; then
            GAME=demo npx tsx tools/verify-variants.ts --prove --max=200000 --out="web-scumm-$TAG-remix-demo.json"
            GAME=reference npx tsx tools/verify-variants.ts --prove --max=200000 --out="web-scumm-$TAG-remix-reference.json"
            echo "REMIX_ASSETS=web-scumm-$TAG-remix-demo.json web-scumm-$TAG-remix-reference.json" >> "$GITHUB_ENV"
          else
            echo "::notice::$TAG predates Remix: no catalogue to prove"
          fi
      - name: Build archive, checksum and SBOM
        run: |
          # The site the candidate built and qualified (4.1.20): published as it is, never built again for the release
          # (release-check above builds one to check, not to publish). Its file digests and the surfaces beside it.
          for d in site surfaces signing; do test -d ".candidate/$d" || { echo "::error::run $CANDIDATE has no candidate-$d: nothing is made again here"; exit 1; }; done
          cp .candidate/site/dist.tar.gz "web-scumm-$TAG-dist.tar.gz"
          cp .candidate/site/assets-manifest.json "web-scumm-$TAG-assets-manifest.json"
          cp .candidate/site/site-files.json "web-scumm-$TAG-site-files.json"
          cp .candidate/surfaces/qualification-surfaces.json "web-scumm-$TAG-surfaces.json"
          # The signing rehearsal's report (4.1.20 PR 3b), as the candidate's manifest lists it.
          cp .candidate/signing/signing-rehearsal.json "web-scumm-$TAG-signing-rehearsal.json"
          # Since 4.1.20 (plan §8.4) this job makes nothing the candidate made: the four archives (packed once, installed
          # outside the repository on three systems), their SBOMs, the Bridge's image (its archive, identities and SBOM)
          # are the candidate's, checked against its manifest above, copied under the names tools/release/artifacts.mjs
          # gives them. A candidate without one of them stops the release here (every tag that still publishes has them).
          for d in pack sbom image; do test -d ".candidate/$d" || { echo "::error::run $CANDIDATE has no candidate-$d: nothing is made again here"; exit 1; }; done
          cp .candidate/sbom/web-scumm.cdx.json "web-scumm-$TAG-sbom.cdx.json"
          cp .candidate/pack/web-scumm-[0-9]*.tgz .candidate/pack/create-web-scumm-*.tgz .candidate/pack/web-scumm-bridge-*.tgz .
          cp .candidate/pack/web-scumm-connectors-*.tgz .
          extra="$(ls web-scumm-connectors-*.tgz) web-scumm-$TAG-site-files.json web-scumm-$TAG-surfaces.json web-scumm-$TAG-signing-rehearsal.json"
          cp .candidate/sbom/web-scumm-bridge.cdx.json "web-scumm-bridge-$TAG-sbom.cdx.json"
          cp .candidate/sbom/web-scumm-connectors.cdx.json "web-scumm-connectors-$TAG-sbom.cdx.json"
          cp .candidate/sbom/create-web-scumm.cdx.json "create-web-scumm-$TAG-sbom.cdx.json"
          extra="$extra web-scumm-connectors-$TAG-sbom.cdx.json create-web-scumm-$TAG-sbom.cdx.json"
          # The Studio Server (4.2.1) and its SBOM; a tag older than 4.2.1 has none.
          if ls .candidate/pack/web-scumm-studio-server-*.tgz >/dev/null 2>&1; then
            cp .candidate/pack/web-scumm-studio-server-*.tgz .
            cp .candidate/sbom/web-scumm-studio-server.cdx.json "web-scumm-studio-server-$TAG-sbom.cdx.json"
            extra="$extra $(ls web-scumm-studio-server-*.tgz) web-scumm-studio-server-$TAG-sbom.cdx.json"
          fi
          cp .candidate/image/web-scumm-bridge-image.tar "web-scumm-bridge-image-$TAG.tar"
          cp .candidate/image/web-scumm-bridge-image.json "web-scumm-bridge-image-$TAG.json"
          cp .candidate/image/web-scumm-bridge-image.cdx.json "web-scumm-bridge-image-$TAG-sbom.cdx.json"
          extra="$extra web-scumm-bridge-image-$TAG.tar web-scumm-bridge-image-$TAG.json web-scumm-bridge-image-$TAG-sbom.cdx.json"
          # The candidate's baseline (4.1.19): its measures of this very SHA, checked against the manifest above.
          for f in .candidate/baseline/baseline-*.json .candidate/baseline/baseline-*.md; do
            [ -f "$f" ] || continue
            cp "$f" "web-scumm-$TAG-baseline.${f##*.}"
            extra="$extra web-scumm-$TAG-baseline.${f##*.}"
          done
          # A complete speedrun of the reference chapter (4.1.14, its ninth asset): verified by the very tool a
          # leaderboard runs before it is attached; a run the engine of this tag refuses stops the release.
          # This workflow runs from main's copy while it checks out the tag's commit: a tag older than 4.1.14 has no
          # speedrun to verify or attach, and its list of files says so (4.1.15).
          if [ -f tests/fixtures/speedrun/reference-any.wsrun ]; then
            GAME=reference npm run -s speedrun:verify -- tests/fixtures/speedrun/reference-any.wsrun
            cp tests/fixtures/speedrun/reference-any.wsrun "web-scumm-$TAG-reference-any.wsrun"
            extra="$extra web-scumm-$TAG-reference-any.wsrun"
          fi
          # The candidate's runs (4.1.17): the five worlds and 4.1.15's schema 1 file, their manifest, the report of the
          # check that made them, and the candidate's manifest itself; checked against their sums above, copied as they are.
          if [ -n "${CANDIDATE:-}" ]; then
            for f in .candidate/wsrun/*.wsrun; do cp "$f" "web-scumm-$TAG-$(basename "$f")"; extra="$extra web-scumm-$TAG-$(basename "$f")"; done
            cp .candidate/wsrun/wsrun-manifest.json "web-scumm-$TAG-wsrun-manifest.json"
            cp .candidate/e2e-remix-speedrun.txt "web-scumm-$TAG-e2e-remix-speedrun.txt"
            cp .candidate-manifest/candidate-manifest.json "web-scumm-$TAG-candidate.json"
            extra="$extra web-scumm-$TAG-wsrun-manifest.json web-scumm-$TAG-e2e-remix-speedrun.txt web-scumm-$TAG-candidate.json"
          fi
          sha256sum "web-scumm-$TAG-dist.tar.gz" "web-scumm-$TAG-assets-manifest.json" "web-scumm-$TAG-sbom.cdx.json" "web-scumm-bridge-$TAG-sbom.cdx.json" $extra ${REMIX_ASSETS:-} web-scumm-[0-9]*.tgz create-web-scumm-*.tgz web-scumm-bridge-*.tgz > "web-scumm-$TAG-SHA256SUMS"
          echo "EXTRA_ASSETS=$extra" >> "$GITHUB_ENV"
          # Every file of the release, and none other, as the one manifest lists them (4.1.20, plan §8.4).
          # Guarded on the file, as every step a tag's commit may predate (this workflow runs from main).
          if [ -f tools/release/artifacts.mjs ]; then
            node tools/release/artifacts.mjs check-release --tag="$TAG" --candidate=.candidate-manifest/candidate-manifest.json --dir=.
          else
            echo "::notice::$TAG predates tools/release/artifacts.mjs: its files are not checked against the manifest"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Every file the release carries (4.1.2): the archives and packages, the manifests, both SBOMs, the sums.
          subject-path: |
            web-scumm-${{ env.TAG }}-dist.tar.gz
            web-scumm-${{ env.TAG }}-assets-manifest.json
            web-scumm-${{ env.TAG }}-sbom.cdx.json
            web-scumm-bridge-${{ env.TAG }}-sbom.cdx.json
            web-scumm-*-reference-any.wsrun
            web-scumm-*-remix-*.json
            web-scumm-*-run-*.wsrun
            web-scumm-*-wsrun-manifest.json
            web-scumm-*-e2e-remix-speedrun.txt
            web-scumm-*-candidate.json
            web-scumm-*-baseline.*
            web-scumm-*-site-files.json
            web-scumm-*-surfaces.json
            web-scumm-*-signing-rehearsal.json
            web-scumm-${{ env.TAG }}-SHA256SUMS
            web-scumm-[0-9]*.tgz
            create-web-scumm-*.tgz
            web-scumm-bridge-*.tgz
            web-scumm-connectors-*.tgz
            web-scumm-connectors-*-sbom.cdx.json
            create-web-scumm-*-sbom.cdx.json
            web-scumm-studio-server-*
            web-scumm-bridge-image-*
      - run: |
          # A pre-release tag (`v4.1.8-rc.1`, 4.1.8) is published as a GitHub pre-release: same files, same checks.
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          # Draft, every file, then published (4.1.20 PR 3b): an immutable release takes its files while it is a draft.
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md $pre
          gh release upload "$TAG" "web-scumm-$TAG-dist.tar.gz" "web-scumm-$TAG-assets-manifest.json" "web-scumm-$TAG-sbom.cdx.json" "web-scumm-bridge-$TAG-sbom.cdx.json" $EXTRA_ASSETS ${REMIX_ASSETS:-} web-scumm-[0-9]*.tgz create-web-scumm-*.tgz web-scumm-bridge-*.tgz "web-scumm-$TAG-SHA256SUMS"
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
      # What was published, read back (4.1.8): every file downloaded, the sums checked, every attestation verified.
      - run: node tools/release/ship.mjs verify "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
